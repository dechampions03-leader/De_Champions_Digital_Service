<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCDS | Payment Confirmation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top, #45216b 0%, transparent 45%),
        linear-gradient(145deg, #0c0615, #1b0d2c);
    color: #fff;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 460px;
    padding: 38px 25px;
    text-align: center;
    background: linear-gradient(145deg, #29153f, #160c24);
    border: 1px solid #8654b5;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.4);
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #e0c1ff;
    text-shadow: 0 0 20px #9b55e8;
}

.brand {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #c5a5e7;
}

h1 {
    margin-top: 30px;
    margin-bottom: 15px;
    font-size: 23px;
    color: #e4caff;
}

.message {
    color: #d2c3e0;
    font-size: 14px;
    line-height: 1.8;
    margin-top: 15px;
}

.loader {
    width: 48px;
    height: 48px;
    margin: 28px auto;
    border: 4px solid #553875;
    border-top-color: #e0baff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

button {
    display: none;
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7837b9, #a45ce4);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.footer {
    margin-top: 30px;
    font-size: 11px;
    color: #9d88b0;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">DCDS</div>

    <div class="brand">
        DE CHAMPIONS DIGITAL SERVICE
    </div>

    <h1 id="title">Confirming Your Payment</h1>

    <div class="loader" id="loader"></div>

    <p class="message" id="message">
        Please wait while we securely verify your Flutterwave transaction.
        Do not close this page.
    </p>

    <button id="retry" onclick="verifyPayment()">
        TRY AGAIN
    </button>

    <div class="footer">
        CREATE • LEARN • INNOVATE • EARN
    </div>

</div>

<script>

// =====================================
// 1. SUPABASE CONFIGURATION
// =====================================

const SUPABASE_URL =
"https://qxsenflgaweeadvggnyp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// =====================================
// 2. PAGE ELEMENTS
// =====================================

const title = document.getElementById("title");
const message = document.getElementById("message");
const loader = document.getElementById("loader");
const retry = document.getElementById("retry");


// =====================================
// 3. GET FLUTTERWAVE PARAMETERS
// =====================================

const params = new URLSearchParams(
    window.location.search
);

const transactionId = params.get("transaction_id");
const txRef = params.get("tx_ref");
const paymentStatus = params.get("status");


// =====================================
// 4. PREVENT DUPLICATE VERIFICATION
// =====================================

let isVerifying = false;


// =====================================
// 5. DISPLAY ERRORS
// =====================================

function showError(text) {

    loader.style.display = "none";

    title.textContent = "Payment Confirmation";

    message.textContent = text;

    retry.style.display = "block";
    retry.disabled = false;
}


// =====================================
// 6. VERIFY PAYMENT
// =====================================

async function verifyPayment() {

    if (isVerifying) return;

    isVerifying = true;

    retry.style.display = "none";
    loader.style.display = "block";

    title.textContent = "Verifying Your Payment";

    message.textContent =
        "Please wait while DCDS securely checks your transaction with Flutterwave.";

    try {

        // Check transaction information

        if (!transactionId || !txRef) {

            throw new Error(
                "Flutterwave did not return the required transaction details. Please contact DCDS support."
            );

        }


        // Check logged-in student

        const {
            data: sessionData,
            error: sessionError
        } = await db.auth.getSession();


        if (sessionError) {
            throw new Error(
                "Unable to check your login session. Please try again."
            );
        }


        if (!sessionData.session) {

            throw new Error(
                "Your login session has expired. Please log in using the account you used to purchase this course."
            );

        }


        // Call Supabase payment verification

        const {
            data,
            error
        } = await db.functions.invoke(
            "verify-payment",
            {
                body: {
                    transaction_id: transactionId,
                    tx_ref: txRef
                }
            }
        );


        // Check function errors

        if (error) {

            console.error(
                "Verification function error:",
                error
            );

            throw new Error(
                "We could not reach the payment verification service. Please try again."
            );

        }


        // Check verification response

        if (!data || !data.success) {

            throw new Error(
                data?.error ||
                "Flutterwave has not confirmed this payment yet."
            );

        }


        // Check learning destination

        if (!data.learning_url) {

            throw new Error(
                "Payment was verified, but the learning page address was not returned. Please contact DCDS support."
            );

        }


        // SUCCESS

        title.textContent = "Payment Successful! 🎉";

        message.textContent =
            "Congratulations, Champion! Your payment has been verified. Opening your purchased course now...";

        loader.style.display = "none";

        setTimeout(() => {

            window.location.assign(
                data.learning_url
            );

        }, 2000);


    } catch (error) {

        console.error(
            "DCDS payment verification:",
            error
        );

        showError(
            error.message ||
            "Something went wrong. Please try again."
        );

    } finally {

        isVerifying = false;

    }

}


// =====================================
// 7. START AUTOMATIC VERIFICATION
// =====================================

verifyPayment();

</script>

</body>
</html>
