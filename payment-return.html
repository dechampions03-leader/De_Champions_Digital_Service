<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCDS | Confirming Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #10091c;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 450px;
    padding: 40px 25px;
    text-align: center;
    background: linear-gradient(145deg, #281440, #170d25);
    border: 1px solid #7543a5;
    border-radius: 20px;
}

.logo {
    color: #d9b8ff;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
}

h1 {
    color: #e1c5ff;
    font-size: 24px;
    margin-top: 25px;
}

p {
    color: #c7b9d7;
    line-height: 1.7;
}

.loader {
    width: 45px;
    height: 45px;
    border: 4px solid #51346e;
    border-top-color: #d9b8ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 25px auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

button {
    display: none;
    padding: 13px 22px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #8738d1;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">DCDS</div>

    <h1 id="title">Confirming Your Payment</h1>

    <div class="loader" id="loader"></div>

    <p id="message">
        Please wait while we securely verify your Flutterwave transaction.
    </p>

    <button id="retry" onclick="verifyPayment()">
        Try Again
    </button>

</div>

<script>
const SUPABASE_URL =
"https://qxsenflgaweeadvggnyp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const params = new URLSearchParams(window.location.search);

const transactionId = params.get("transaction_id");
const txRef = params.get("tx_ref");
const paymentStatus = params.get("status");

const title = document.getElementById("title");
const message = document.getElementById("message");
const loader = document.getElementById("loader");
const retry = document.getElementById("retry");

function showError(text) {
    loader.style.display = "none";
    title.textContent = "Payment Confirmation";
    message.textContent = text;
    retry.style.display = "inline-block";
}

async function verifyPayment() {

    retry.style.display = "none";
    loader.style.display = "block";

    if (!transactionId || !txRef) {
        showError("Transaction details are missing. Please contact DCDS support.");
        return;
    }

    if (paymentStatus && paymentStatus.toLowerCase() !== "successful") {
        showError("Flutterwave did not report a successful payment. Please check your payment status.");
        return;
    }

    try {

        const { data: sessionData, error: sessionError } =
            await db.auth.getSession();

        if (sessionError || !sessionData.session) {
            showError("Please log in with the same account you used to purchase the course, then return to this page.");
            return;
        }

        const { data, error } =
            await db.functions.invoke("verify-payment", {
                body: {
                    transaction_id: transactionId,
                    tx_ref: txRef
                }
            });

        if (error) {
            throw new Error("We couldn't contact the payment verification service. Please try again.");
        }

        if (!data || !data.success || !data.learning_url) {
            throw new Error(data?.error || "Your payment could not be confirmed.");
        }

        title.textContent = "Payment Successful! 🎉";

        message.textContent =
            "Your payment has been verified. Opening your purchased course...";

        loader.style.display = "none";

        setTimeout(() => {
            window.location.assign(data.learning_url);
        }, 1800);

    } catch (error) {

        console.error("DCDS payment return error:", error);

        showError(error.message || "Something went wrong. Please try again.");
    }
}

verifyPayment();
</script>

</body>
</html>
