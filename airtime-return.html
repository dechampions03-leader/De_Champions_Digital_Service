<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35105f">
<title>DCDS Top-up Payment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--purple:#7628d8;--deep:#21083f;--gold:#e4c16d;--line:#eadff2;--ink:#28183a}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#fdfaff,#f2e8ff);font-family:Arial,sans-serif;color:var(--ink)}
main{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 55px #34105117}
.brand{font-weight:800;color:#542080;letter-spacing:.08em;font-size:12px}
h1{font-size:26px;color:#351052;margin:22px 0 10px}
p{line-height:1.7;color:#756783;font-size:14px}
.state{margin-top:18px;padding:14px;border-radius:13px;background:#f8f2ff;color:#5e387e;font-size:13px;line-height:1.7}
button,a{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;padding:13px 18px;border-radius:12px;border:0;background:linear-gradient(120deg,#d7b45a,#f0d88e);color:#351052;font-weight:800;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
small{display:block;margin-top:20px;color:#95869f}
</style>
</head>
<body>
<main>
 <div class="brand">DE CHAMPIONS DIGITAL SERVICE</div>
 <h1 id="title">Checking your payment…</h1>
 <p id="message">DCDS is verifying your Flutterwave payment before asking Oplug to deliver your top-up.</p>
 <div id="state" class="state" role="status" aria-live="polite">Please keep this page open.</div>
 <button id="retry" type="button" hidden>Check delivery status</button>
 <a href="airtime-data.html">Back to Airtime &amp; Data</a>
 <small>Never pay again while an order is processing or being reconciled.</small>
</main>
<script>
const PROD_HOSTS=["dechampions03-leader.github.io","dechampionsdigital.com","www.dechampionsdigital.com"];
const production=PROD_HOSTS.includes(location.hostname.toLowerCase());
const url=production?"https://qxsenflgaweeadvggnyp.supabase.co":"https://tjgsxbmkpvktlqulbktv.supabase.co";
const key=production?"sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP":"sb_publishable_HHR1gFS6wHvljkTZ0nLWMw_7kfVM3Mn";
const db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search);
const transactionId=params.get("transaction_id")||"";
const txRef=params.get("tx_ref")||"";
const paymentStatus=(params.get("status")||"").toLowerCase();
const title=document.getElementById("title");
const message=document.getElementById("message");
const state=document.getElementById("state");
const retry=document.getElementById("retry");
let busy=false;
async function run(checkOnly=false){
 if(busy)return;
 busy=true;retry.disabled=true;
 try{
  const {data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError||!session){
   title.textContent="Sign in required";
   message.textContent="Your payment return needs your DCDS account session so the order can be matched securely.";
   state.textContent="Sign in to the same account you used to start this top-up, then reopen this return page.";
   retry.hidden=true;
   return;
  }
  if(!txRef){
   title.textContent="Payment reference missing";
   state.textContent="No DCDS transaction reference was returned. Contact DCDS support before paying again.";
   return;
  }
  if(!checkOnly && paymentStatus && !["successful","completed"].includes(paymentStatus)){
   title.textContent="Payment not completed";
   message.textContent="Flutterwave did not return a successful payment status. No Oplug top-up has been submitted.";
   state.textContent="You can return to Airtime & Data and start again after confirming that no charge was made.";
   return;
  }
  state.textContent=checkOnly?"Checking Oplug delivery status…":"Verifying your Flutterwave payment…";
  const {data,error}=await db.functions.invoke("dcds-vtu-payments",{body:checkOnly?{action:"check_status",tx_ref:txRef}:{action:"confirm_payment",tx_ref:txRef,transaction_id:transactionId}});
  if(error)throw error;
  if(!data?.success)throw new Error(data?.error||"The transaction could not be confirmed.");
  if(data.payment_status!=="successful"){
   title.textContent="Payment not confirmed yet";
   state.textContent=data.message||"Flutterwave has not confirmed payment. Please wait and check again.";
   retry.hidden=false;
   return;
  }
  if(data.fulfillment_status==="successful"){
   title.textContent="Top-up delivered successfully!";
   message.textContent="Flutterwave payment is verified and Oplug confirms delivery.";
   state.textContent="Your airtime/data top-up has been completed. Thank you for using DCDS!";
   retry.hidden=true;
  }else if(data.fulfillment_status==="failed"){
   title.textContent="Delivery needs support";
   message.textContent="Your payment was verified, but Oplug reported that the top-up did not complete.";
   state.textContent="Please contact DCDS support for a refund review. Do not pay again for this order.";
   retry.hidden=false;
  }else{
   title.textContent="Top-up processing";
   message.textContent="Your payment is secure. DCDS is checking the provider's final delivery status.";
   state.textContent=data.message||"The provider has not returned a final result. You can check again shortly; do not start another purchase.";
   retry.hidden=false;
  }
 }catch(error){
  title.textContent="We are still checking";
  message.textContent="Do not make another payment or start another top-up for this order.";
  state.textContent=String(error?.message||"The verification service is temporarily unavailable.");
  retry.hidden=false;
 }finally{
  busy=false;retry.disabled=false;
 }
}
retry.addEventListener("click",()=>run(true));
run(false);
</script>
</body>
</html>
