<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35105f">
<title>DCDS | Airtime & Data Confirmation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./assets/dcds-mobile-fit.css?v=1">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0%,#f0e5ff,transparent 36%),linear-gradient(145deg,#fcfaff,#f5edff 58%,#fffaf0);font-family:Arial,sans-serif;color:#2e1942}
.card{width:min(100%,480px);padding:30px 24px;border:1px solid #e5d8f0;border-radius:24px;background:#fff;box-shadow:0 20px 60px #34105218;text-align:center}
.logo{width:62px;height:62px;margin:0 auto 12px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#6f2bc0,#a65ce5);color:#fff;font-weight:900;font-size:20px;box-shadow:0 9px 24px #6931a22b}
.brand{font-size:10px;letter-spacing:.16em;font-weight:800;color:#7e51a3}
h1{margin:25px 0 9px;color:#351052;font-size:24px}
#message{margin:0;color:#746581;font-size:14px;line-height:1.75}
.loader{width:38px;height:38px;margin:22px auto;border:4px solid #ebdff5;border-top-color:#7b36bf;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.details{margin-top:20px;padding:14px;border-radius:14px;background:#faf6ff;text-align:left;font-size:12px;line-height:1.8;color:#735d85}
.actions{display:grid;gap:10px;margin-top:22px}
a,button{display:block;padding:14px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:800}
button{border:0;background:linear-gradient(110deg,#d9b863,#f2d990);color:#351052}
a{border:1px solid #e5d8f0;color:#5e3684}
button[hidden]{display:none}
footer{margin-top:25px;color:#9b8ba8;font-size:10px;letter-spacing:.14em}
</style>
</head>
<body>
<main class="card">
 <div class="logo">DCDS</div>
 <div class="brand">DE CHAMPIONS DIGITAL SERVICES</div>
 <h1 id="title">Confirming your payment</h1>
 <div class="loader" id="loader"></div>
 <p id="message" role="status" aria-live="polite">DCDS is securely checking your Flutterwave payment and preparing your top-up. Please do not pay again.</p>
 <div class="details" id="details" hidden></div>
 <div class="actions">
  <button id="retry" type="button" hidden>Check this payment again</button>
  <a href="airtime-data.html#purchaseHistory">View my purchase history</a>
  <a href="index.html">Return to DCDS home</a>
  <a href="airtime-data.html">Back to Airtime &amp; Data</a>
 </div>
 <footer>CREATE • LEARN • INNOVATE • EARN</footer>
</main>
<script>
const SUPABASE_URL="https://qxsenflgaweeadvggnyp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search);
const txRef=params.get("tx_ref")||"";
const transactionId=params.get("transaction_id")||"";
const queryStatus=(params.get("status")||"").toLowerCase();
const title=document.getElementById("title");
const message=document.getElementById("message");
const loader=document.getElementById("loader");
const details=document.getElementById("details");
const retry=document.getElementById("retry");
let busy=false;
function show(status,text,order){
 loader.hidden=true;loader.style.display="none";
 title.textContent=status==="successful"?"Top-up successful!":status==="processing"?"Payment confirmed":status==="refund_required"?"Refund review required":status==="failed"?"Payment not completed":"Payment confirmation";
 message.textContent=text;
 retry.hidden=!(status==="processing"||status==="pending_payment");
 if(order){
  details.hidden=false;
  const pairs=[["Service",order.service_type==="data"?"Data bundle":"Airtime"],["Network",order.network],["Recipient",order.recipient],["Plan",order.plan||"—"],["Amount", new Intl.NumberFormat("en",{style:"currency",currency:String(order.currency||"NGN").toUpperCase(),maximumFractionDigits:2}).format(Number(order.amount||0))],["Reference",order.reference]];
  details.replaceChildren();
  for(const [label,value] of pairs){const row=document.createElement("div");const b=document.createElement("b");b.textContent=label+": ";row.append(b,document.createTextNode(String(value)));details.append(row);}
 }
}
async function verify(){
 if(busy)return;
 if(!txRef||!transactionId){
  if(queryStatus==="cancelled"||queryStatus==="failed")show("failed","Flutterwave did not complete this checkout. No top-up was sent. You can start a new order from Airtime & Data.");
  else show("Payment confirmation","The required Flutterwave reference is missing. Please contact DCDS support before trying another payment.");
  return;
 }
 busy=true;retry.hidden=true;loader.hidden=false;loader.style.display="block";
 try{
  const {data:sessionData,error:sessionError}=await db.auth.getSession();
  if(sessionError||!sessionData.session){
   show("Payment confirmation","Your DCDS session is not available on this device. The secure Flutterwave webhook will still verify and process this order. Please sign in before checking again; do not pay again.");
   retry.hidden=true;return;
  }
  const {data,error}=await db.functions.invoke("dcds-vtu-process-payment",{body:{transaction_id:transactionId,tx_ref:txRef}});
  if(error)throw error;
  const status=data?.status||"needs_review";
  if(status==="successful")show(status,data.message||"Your airtime or data top-up was sent successfully.",data.order);
  else if(status==="processing"||status==="pending_payment")show(status,data?.message||data?.error||"Your payment is being confirmed. Please do not pay again.",data.order);
  else if(status==="refund_required")show(status,data.message||"Payment was received, but the provider did not complete the top-up. DCDS support must arrange a refund.",data.order);
  else if(status==="failed")show(status,data.error||"Flutterwave did not confirm payment. No top-up was sent.",data.order);
  else show("needs_review",data?.error||"DCDS is reviewing this payment. Please do not pay again.",data?.order);
 }catch(error){
  console.error("DCDS VTU return verification:",error);
  show("processing","We could not retrieve the final status just now. Your payment may still be processing. Do not pay again; try checking this same payment again shortly.");
  retry.hidden=false;
 }finally{busy=false;}
}
retry.addEventListener("click",verify);
verify();
</script>
</body>
</html>
