name: DCDS Super Intelligence validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "ai-learning-assistant.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"
  push:
    branches:
      - main
      - feature/dcds-super-intelligence
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "ai-learning-assistant.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"

permissions:
  contents: read

concurrency:
  group: dcds-super-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check DCDS AI Edge Functions
        run: |
          deno check supabase/functions/dcds-ai-chat/index.ts
          deno check supabase/functions/dcds-ai-speech-session/index.ts

      - name: Validate live retrieval, privacy boundaries and evaluation coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          function_path = Path("supabase/functions/dcds-ai-chat/index.ts")
          function = function_path.read_text(encoding="utf-8")
          start = function.index("async function searchPlatformKnowledge(")
          end = function.index("// Discover model names dynamically", start)
          search_helper = function[start:end]
          ai_page = Path("ai-learning-assistant.html").read_text(encoding="utf-8")
          submit_handler = ai_page.split("form.addEventListener('submit'", 1)[1].split(" });\n})();", 1)[0]

          allowed_tables = (
              'from("courses")',
              'from("public_announcements")',
              'from("dcds_reviews")',
              'from("enrollments")',
              'from("course_lessons")',
              'from("course_materials")',
          )
          for table in allowed_tables:
              if table not in search_helper:
                  raise SystemExit(f"Live retrieval helper is missing approved source: {table}")

          forbidden_tables = (
              'from("payments")',
              'from("orders")',
              'from("profiles")',
              'from("dcds_referrals")',
              'from("dcds_reward_ledger")',
              'from("dcds_payout_requests")',
              'from("dcds_international_payout_requests")',
              'from("student_support_tickets")',
              'from("student_admin_notes")',
              'from("quiz_answer_keys")',
              'from("quiz_attempt_answers")',
          )
          for table in forbidden_tables:
              if table in search_helper:
                  raise SystemExit(f"Disallowed private/financial retrieval source found: {table}")

          invariants = {
              "public guest mode is verified server-side as an anonymous or unverified session":
                  'const isGuest = anonymous || !verifiedContact' in function
                  and "body.adult_confirmation !== true" in function,
              "adult AI access does not depend on the global approval switch":
                  "dcds_ai_access_settings" not in function
                  and 'eligibility?.age_band === "18_plus"' in function,
              "student AI access requires server-verified adult 18+ eligibility while Gemini is active":
                  'eligibility?.age_band === "18_plus"' in function
                  and "UNDER_18_AI_UNAVAILABLE" in function
                  and "if (!adultAllowed)" in function,
              "administrator AI requests require an 18+ declaration":
                  'role === "admin" && body.adult_confirmation !== true' in function,
              "signed-in greetings use profile display name only for personalization":
                  "accountFirstName" in function and "full_name" in function and "ACCOUNT DISPLAY NAME FOR GREETING ONLY" in function,
              "guest platform search excludes private enrolled lessons":
                  'if (role === "student")' in search_helper,
              "guest and student chat history persistence remain separate":
                  'if (role === "student") {' in function
                  and "dcds_ai_conversations" in function
                  and "dcds_ai_student_memory" in function,
              "visitor message volume has a stricter per-session allowance":
                  'role === "guest" ? 3' in function
                  and 'role === "guest" ? 5' in function
                  and "p_daily_limit" in function,
              "provider quota exhaustion returns a dedicated recoverable code":
                  "PROVIDER_DAILY_QUOTA" in function
                  and "no-cost provider allowance" in function,
              "message send failures retain the draft and keep the mobile keyboard closed":
                  "your draft is still in the message box" in ai_page
                  and "input.blur()" in ai_page
                  and "input.focus()" not in submit_handler,
              "student lesson retrieval is scoped to the student's own enrollments":
                  '.from("enrollments").select("course_id").eq("user_id", userId)' in search_helper
                  and '.in("course_id", courseIds)' in search_helper,
              "announcements are published and time-scoped":
                  '.eq("status", "published")' in search_helper
                  and '.lte("starts_at", now)' in search_helper
                  and "currentAnnouncements" in search_helper,
              "reviews are approval-filtered":
                  '.eq("is_approved", true)' in search_helper,
              "Gemini model catalogue is discovered dynamically":
                  "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100" in function
                  and "supportedGenerationMethods" in function,
              "Gemini routing is restricted to the documented free-tier text model pool":
                  "FREE_TIER_MODEL_PREFERENCE" in function
                  and '"gemini-3.8-flash"' in function
                  and '"gemini-3.7-flash"' in function
                  and '"gemini-3.6-flash"' in function
                  and '"gemini-3.5-flash-lite"' in function
                  and '"gemini-3.1-flash-lite"' in function
                  and '"gemma-4-26b-a4b-it"' in function
                  and '"gemma-4-31b-it"' in function
                  and '/^(?:gemini|gemma)-[a-z0-9.-]+$/i.test(name)' in function
                  and "gemini-4-carbon" not in function
                  and "gemini-4-argon" not in function,
              "Discovered Gemini models cannot bypass the free-tier allowlist":
                  "FREE_TIER_MODEL_PREFERENCE.filter((candidate) => discoveredModels.includes(candidate))" in function
                  and "Never append the entire discovered catalogue: it includes paid-only models." in function,
              "a stale model catalogue falls back only to documented free-tier models":
                  "discoveredFreeTierModels.length > 0" in function
                  and ": [...FREE_TIER_MODEL_PREFERENCE]" in function,
              "temporary model cooldowns provide a retry interval without misreporting a daily quota":
                  '"PROVIDER_COOLDOWN"' in function
                  and "retry_after_seconds" in function
                  and "retryAfterSeconds" in function,
              "Gemini and Gemma fallback routing has a bounded 42-second generation window":
                  "Date.now() + 42_000" in function
                  and "Math.min(attemptedModels <= 2 ? 7_000 : 5_500, generationDeadline - Date.now())" in function
                  and "const maxModelAttempts = 7" in function,
              "the free-tier fallback pool includes hosted Gemma 4 after the Gemini models":
                  function.indexOf('"gemini-3.1-flash-lite"') < function.indexOf('"gemma-4-26b-a4b-it"')
                  and function.indexOf('"gemma-4-26b-a4b-it"') < function.indexOf('"gemma-4-31b-it"'),
              "normal DCDS tutoring turns prefer the documented fast Flash-Lite model":
                  'Deno.env.get("DCDS_AI_MODEL") || "gemini-3.5-flash-lite"' in function
                  and function.find('"gemini-3.5-flash-lite"') < function.find('"gemini-3.8-flash"'),
              "provider timeouts are logged separately from HTTP/API errors":
                  'failureType: isTimeout ? "client_timeout" : "network_error"' in function,
              "Google Search is opt-in/freshness-triggered":
                  "wantsExternalWebSearch(promptMessage, role)" in function
                  and "google_search: {}" in function,
              "grounded source links are returned":
                  "groundingMetadata" in function and "Sources checked:" in function,
              "general learning is not limited to the static brain":
                  "Do not limit useful teaching to facts in the DCDS knowledge files" in function,
              "shared DCDS facts require official source confirmation":
                  "If a DCDS-specific fact cannot be confirmed" in Path("ai-config/DCDS-MASTER-BRAIN.md").read_text(encoding="utf-8"),
              "student memory remains owner-controlled":
                  "dcds_ai_student_memory" in function
                  and "user.id" in function,
              "image data is sent to Gemini as transient inline data":
                  "inlineData" in function and "imageAttachment" in function,
              "image file type, size and signature are checked":
                  "maxImageBytes" in function and "allowedImageTypes" in function
                  and "isJpeg" in function and "isPng" in function and "isWebp" in function,
              "uploaded image files are not stored in DCDS chat history":
                  "The image file itself is not stored in DCDS chat history" in function,
              "image history markers tell the assistant to request reattachment":
                  "ask them to attach it again" in function,
              "voice dictation remains available through browser speech recognition":
                  "SpeechRecognition" in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "spoken replies use free browser/device speech rather than a paid speech API":
                  "Listen · free voice" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "speechSynthesis" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "dcds-ai-speech-session" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "OpenAI voice sessions use server-mediated WebRTC SDP exchange":
                  "https://api.openai.com/v1/realtime/calls" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "FormData()" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "body: formData" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "natural female-style DCDS voice uses the recommended Realtime model and Marin voice":
                  "gpt-realtime-2.1-mini" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and 'voice: "marin"' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "OpenAI voice sessions are protected by verified-account and age access checks":
                  "getUser()" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "is_dcds_admin" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "guardian_consent_status" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "OpenAI voice generation is usage-limited and keeps the project key server-side":
                  "dcds_consume_ai_request" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and 'Deno.env.get("OPENAI_API_KEY")' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "The browser receives only the SDP answer, not an OpenAI credential":
                  'return json({ success: true, sdp: answerSdp, voice: "marin" })' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "client_secret" not in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "data.client_secret" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "The public AI page does not invoke the dormant paid speech endpoint":
                  "dcds-ai-speech-session" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "api.openai.com" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "natural voice tests are present":
                  "voice-002" in Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8")
                  and "voice-003" in Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8"),
              "public AI composer removes image upload while retaining microphone dictation":
                  "voiceButton" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "SpeechRecognition" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "attachImageButton" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "imageInput" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "requestBody.image" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
          }
          support_helper_start = function.index("async function loadStudentAccountSupportContext(")
          support_helper_end = function.index("async function searchPlatformKnowledge(", support_helper_start)
          support_helper = function[support_helper_start:support_helper_end]
          matcher_start = function.index("function isAdminDirectoryRequest(")
          matcher_end = function.index("function containsPaymentOrBankingIntent(", matcher_start)
          admin_directory_matcher = function[matcher_start:matcher_end]
          answer_cleaner_start = function.index("const cleanGeneratedAnswer =")
          answer_cleaner_end = function.index("const answer =", answer_cleaner_start)
          answer_cleaner = function[answer_cleaner_start:answer_cleaner_end]
          diagnostics_start = function.index('if (\n    role === "admin"\n    && diagnosticRequested')
          diagnostics_end = function.index('if (!geminiApiKey)', diagnostics_start)
          diagnostics_fast_path = function[diagnostics_start:diagnostics_end]
          support_fallback_start = function.index("if (!providerResponse)")
          support_fallback_end = function.index("let result: Record<string, any>", support_fallback_start)
          support_fallback = function[support_fallback_start:support_fallback_end]
          provider_invariants = {
              "all five documented free-tier model candidates can be attempted":
                  "const maxModelAttempts = 5;" in function
                  and "attemptedModels >= maxModelAttempts" in function,
              "provider failure reports attempted and available candidate counts":
                  "attemptedModels," in function and "candidateCount: orderedCandidates.length" in function,
              "provider outage response preserves the draft and provides retry timing":
                  "retry_after_seconds: retryAfterSeconds" in function
                  and "Your draft is kept in the chat box; retry in about " in function,
          }
          for name, passed in provider_invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          provider_failures = [name for name, passed in provider_invariants.items() if not passed]
          if provider_failures:
              raise SystemExit("Deyriva provider failover checks failed: " + "; ".join(provider_failures))

          diagnostics_invariants = {
              "platform diagnostics return from the snapshot before Gemini key/model routing":
                  "buildPlatformDiagnosticsAnswer(platformSnapshotData, includeAdminDirectory)" in diagnostics_fast_path
                  and "return respond({" in diagnostics_fast_path
                  and "if (!geminiApiKey)" not in diagnostics_fast_path,
              "diagnostic response states the unchecked-services list":
                  "SYSTEMS NOT INSPECTED" in function and "not_checked" in function,
              "root-only admin directory remains explicitly gated":
                  "isRootAdmin && adminDirectoryRequested" in function
                  and "platformSnapshotData.admin_directory_visible === true" in function,
              "student provider outage still routes human support requests":
                  "dcds-human-support-route" in support_fallback
                  and "student-dashboard.html#studentSupportPanel" in support_fallback,
              "student fallback does not claim that it submitted a ticket":
                  "submit your issue" in support_fallback
                  and "ticket was created" not in support_fallback.lower(),
              "provider-independent diagnostics retain payment exclusions":
                  "No student payment amounts" in function and "Payment-category support tickets were excluded" in function,
          }
          for name, passed in diagnostics_invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          diagnostic_failures = [name for name, passed in diagnostics_invariants.items() if not passed]
          if diagnostic_failures:
              raise SystemExit("Deyriva provider-outage fallback checks failed: " + "; ".join(diagnostic_failures))

          diagnostics_invariants = {
              "ordinary root-admin wording does not automatically request a directory":
                  "root admin" not in admin_directory_matcher.lower() and "super_admin" not in admin_directory_matcher.lower(),
              "answer cleaner normalises repeated exclamation marks":
                  '.replace(/([!?])' in answer_cleaner and '1+/g' in answer_cleaner,
              "platform health uses authenticated read-only snapshot RPC":
                  "dcds_ai_platform_snapshot" in function and "isPlatformDiagnosticsRequest" in function,
              "admin directory is only requested for verified root admins":
                  "isRootAdmin && adminDirectoryRequested" in function,
              "ordinary admin identity requests are denied":
                  "ADMINISTRATOR IDENTITY PRIVACY" in function,
              "student ticket lookups are scoped to the signed-in student":
                  '.eq("user_id", userId)' in support_helper,
              "student support tickets exclude financial category":
                  '.neq("category", "payment")' in support_helper,
              "ticket subject and reply bodies are not passed to Deyriva":
                  'select("category,status,responded_at,created_at,updated_at,admin_response")' in support_helper
                  and "subject: ticket.subject" not in support_helper
                  and "admin_response: ticket.admin_response" not in support_helper,
              "support helper does not read payments or payouts":
                  all(term not in support_helper for term in ['from("payments")','from("orders")','from("dcds_payout_requests")','from("dcds_referrals")']),
              "student Support Centre, community and admin inbox routes exist":
                  "student-dashboard.html#studentSupportPanel" in function
                  and "student-community.html" in function
                  and "admin-notifications.html#supportInboxSection" in function,
              "health scope states services not checked":
                  "not_checked" in function,
              "raw internal source IDs are stripped from generated answers":
                  'replace(/\\[(?:DCDS|WEB)-\\d+\\]/g, "")' in function
          }
          for name, passed in diagnostics_invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          diagnostic_failures = [name for name, passed in diagnostics_invariants.items() if not passed]
          if diagnostic_failures:
              raise SystemExit("Deyriva health/support/privacy validation failed: " + "; ".join(diagnostic_failures))

          failures = [name for name, passed in invariants.items() if not passed]
          for name, passed in invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          if failures:
              raise SystemExit(f"{len(failures)} DCDS Super Intelligence invariants failed.")

          knowledge = json.loads(Path("dcds-ai-knowledge-base.json").read_text(encoding="utf-8"))
          evaluation = json.loads(Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8"))
          test_id_values = [item.get("id") for item in evaluation.get("tests", [])]
          duplicate_test_ids = sorted({
              test_id for test_id in test_id_values
              if test_id and test_id_values.count(test_id) > 1
          })
          if duplicate_test_ids:
              raise SystemExit("Duplicate DCDS AI evaluation IDs: " + ", ".join(duplicate_test_ids))
          test_ids = set(test_id_values)
          required_tests = {
              "retrieval-001", "retrieval-002", "retrieval-003",
              "learning-003", "web-001", "memory-001", "memory-002", "security-002",
              "image-001", "image-002", "voice-001", "voice-002", "voice-003",
              "guest-001", "guest-002", "chat-001", "identity-001",
              "audit-001", "privacy-001", "admin-privacy-001", "root-report-001",
              "support-001", "student-support-001", "support-002", "format-001",
              "audit-fallback-001",
              "provider-503-001",
          }
          missing = sorted(required_tests - test_ids)
          if missing:
              raise SystemExit("Missing DCDS Super Intelligence evaluation tests: " + ", ".join(missing))
          if not knowledge.get("assistant_policy", {}).get("current_state"):
              raise SystemExit("DCDS AI knowledge base has no current state policy.")
          print("Validated DCDS AI knowledge JSON and all required Super Intelligence evaluation cases.")
          PY
