name: DCDS Super Intelligence validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/migrations/*dcds_ai_opt_in_learning_memory.sql"
      - "supabase/migrations/*dcds_ai_age_guardian_eligibility.sql"
      - "supabase/migrations/*dcds_ai_daily_usage_budget.sql"
      - "ai-learning-assistant.html"
      - "dcds-ai-access-review.html"
      - "admin-account-deletions.html"
      - "privacy-policy.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"
  push:
    branches:
      - main
      - feature/dcds-super-intelligence
      - feature/dcds-ai-private-learning-memory
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/migrations/*dcds_ai_opt_in_learning_memory.sql"
      - "supabase/migrations/*dcds_ai_age_guardian_eligibility.sql"
      - "supabase/migrations/*dcds_ai_daily_usage_budget.sql"
      - "ai-learning-assistant.html"
      - "dcds-ai-access-review.html"
      - "admin-account-deletions.html"
      - "privacy-policy.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"

permissions:
  contents: read

concurrency:
  group: dcds-super-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check DCDS AI Edge Function
        run: deno check supabase/functions/dcds-ai-chat/index.ts

      - name: Validate DCDS AI page JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("ai-learning-assistant.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
          scripts = [script.strip() for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline DCDS AI page script was found.")
          Path("/tmp/dcds-ai-page.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dcds-ai-page.js

      - name: Validate live retrieval, OpenAI safety, age gates, native actions and evaluation coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          function_path = Path("supabase/functions/dcds-ai-chat/index.ts")
          function = function_path.read_text(encoding="utf-8")
          page = Path("ai-learning-assistant.html").read_text(encoding="utf-8")
          admin_page = Path("dcds-ai-access-review.html").read_text(encoding="utf-8")
          master = Path("ai-config/DCDS-MASTER-BRAIN.md").read_text(encoding="utf-8")
          knowledge = json.loads(Path("dcds-ai-knowledge-base.json").read_text(encoding="utf-8"))
          evaluation = json.loads(Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8"))

          start = function.index("async function searchPlatformKnowledge(")
          end = function.index("function wantsExternalWebSearch", start)
          search_helper = function[start:end]

          allowed_tables = (
              'from("courses")',
              'from("public_announcements")',
              'from("dcds_reviews")',
              'from("enrollments")',
              'from("course_lessons")',
              'from("course_materials")',
          )
          for table in allowed_tables:
              if table not in search_helper:
                  raise SystemExit(f"Live retrieval helper is missing approved source: {table}")

          forbidden_tables = (
              'from("payments")',
              'from("orders")',
              'from("profiles")',
              'from("dcds_referrals")',
              'from("dcds_reward_ledger")',
              'from("dcds_payout_requests")',
              'from("dcds_international_payout_requests")',
              'from("student_support_tickets")',
              'from("student_admin_notes")',
              'from("quiz_answer_keys")',
              'from("quiz_attempt_answers")',
          )
          for table in forbidden_tables:
              if table in search_helper:
                  raise SystemExit(f"Disallowed private/financial retrieval source found: {table}")

          system_start = function.index("const systemInstruction")
          system_end = function.index("APPROVED DCDS KNOWLEDGE", system_start)
          system_prompt = function[system_start:system_end]

          invariants = {
              "student lesson lookup is limited to own enrolments":
                  '.from("enrollments").select("course_id").eq("user_id", userId)' in search_helper
                  and '.in("course_id", enrolledIds)' in search_helper,
              "only published, in-date announcements are retrieved":
                  '.eq("status", "published")' in search_helper
                  and '.lte("starts_at", now)' in search_helper
                  and "currentAnnouncements" in search_helper,
              "reviews are approval-filtered":
                  '.eq("is_approved", true)' in search_helper,
              "general learning is not limited to static knowledge":
                  "Do not limit useful teaching to facts in the DCDS knowledge files" in function,
              "DCDS identity is stable and provider names are not volunteered":
                  "AI identity and brand loyalty" in system_prompt
                  and "Do not volunteer API vendors" in system_prompt,
              "normal responses direct native resource actions":
                  "native action buttons" in system_prompt
                  and "const resources:" in function
                  and "uniqueResources" in function,
              "OpenAI Responses API is used":
                  'https://api.openai.com/v1/responses' in function
                  and 'const model = Deno.env.get("DCDS_AI_MODEL") || "gpt-6-astra";' in function
                  and 'store: false' in function,
              "Moderation API runs before and after generation":
                  'https://api.openai.com/v1/moderations' in function
                  and "omni-moderation-latest" in function
                  and function.index("moderateDcdsText(openAiApiKey, message)") < function.index("https://api.openai.com/v1/responses")
                  and function.index("moderateDcdsText(openAiApiKey, generatedAnswer)") > function.index("https://api.openai.com/v1/responses"),
              "suspected child exploitation is intercepted locally before Moderation API":
                  "suspectedChildExploitationPattern" in function
                  and function.index("suspectedChildExploitationPattern.test(message)") < function.index("moderateDcdsText(openAiApiKey, message)"),
              "moderation fails closed":
                  "DCDS safety check unavailable" in function
                  and "return json({ success: false" in function,
              "adult age eligibility is server-enforced":
                  'aiEligibility?.age_band === "18_plus"' in function
                  and 'aiEligibility.access_status === "approved"' in function,
              "teen eligibility requires an approved adult guardian":
                  'aiEligibility?.age_band === "13_17"' in function
                  and "dcds_ai_guardian_is_approved_adult" in function
                  and "guardianConsentVerified" in function,
              "under-13 remains blocked unless ZDR gate is explicitly set":
                  "DCDS_AI_UNDER_13_ZDR_ENABLED" in function
                  and "approvedUnder13" in function,
              "eligibility gate runs before provider generation":
                  function.index('from("dcds_ai_access_eligibility")') < function.index('https://api.openai.com/v1/responses'),
              "per-minute and daily caps are explicit":
                  'role === "student" ? 5 : 8' in function
                  and 'role === "student" ? 20 : 60' in function
                  and "p_daily_limit: dailyRateLimit" in function
                  and "max_output_tokens: 1600" in function,
              "automatic learning is opt-in and default false":
                  "autoLearningEnabled" in page
                  and "auto_learning_enabled === true" in function
                  and "DEFAULT false" in Path("supabase/migrations/20261113110000_dcds_ai_opt_in_learning_memory.sql").read_text(encoding="utf-8"),
              "age and guardian schema has RLS and blocked under-13 default":
                  "CREATE TABLE IF NOT EXISTS public.dcds_ai_access_eligibility" in Path("supabase/migrations/20261113120000_dcds_ai_age_guardian_eligibility.sql").read_text(encoding="utf-8")
                  and "ENABLE ROW LEVEL SECURITY" in Path("supabase/migrations/20261113120000_dcds_ai_age_guardian_eligibility.sql").read_text(encoding="utf-8")
                  and "THEN 'blocked'" in Path("supabase/migrations/20261113120000_dcds_ai_age_guardian_eligibility.sql").read_text(encoding="utf-8"),
              "daily usage migration adds server-side daily counts":
                  "daily_request_count" in Path("supabase/migrations/20261113123000_dcds_ai_daily_usage_budget.sql").read_text(encoding="utf-8")
                  and "CREATE FUNCTION public.dcds_consume_ai_request" in Path("supabase/migrations/20261113123000_dcds_ai_daily_usage_budget.sql").read_text(encoding="utf-8"),
              "student frontend fails closed on eligibility":
                  "loadAiEligibility" in page and "setChatEnabled(false)" in page
                  and "dcds_ai_access_eligibility" in page,
              "assistant content is rendered as safe Markdown, not executable HTML":
                  "renderAssistantMarkdown" in page
                  and "textContent" in page
                  and "safeResourceHref" in page,
              "administrator review checks verified adult guardian":
                  "is_dcds_admin" in admin_page
                  and "dcds_ai_guardian_is_approved_adult" in admin_page
                  and "Under-13" in admin_page,
              "privacy policy reflects OpenAI processing and youth controls":
                  "OpenAI API (DCDS Responses and safety services)" in Path("privacy-policy.html").read_text(encoding="utf-8")
                  and "Google Gemini" not in Path("privacy-policy.html").read_text(encoding="utf-8")
                  and "Zero Data Retention" in Path("privacy-policy.html").read_text(encoding="utf-8"),
              "shared DCDS facts require official source confirmation":
                  "If a DCDS-specific fact cannot be confirmed" in master,
          }
          failures = [name for name, passed in invariants.items() if not passed]
          for name, passed in invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          if failures:
              raise SystemExit(f"{len(failures)} DCDS Super Intelligence invariants failed.")

          test_ids = {item.get("id") for item in evaluation.get("tests", [])}
          required_tests = {
              "retrieval-001", "retrieval-002", "retrieval-003",
              "learning-003", "learning-004", "referral-004",
              "memory-001", "memory-002", "memory-003", "memory-004", "memory-005",
              "identity-002", "clarification-002", "voice-001", "voice-002",
              "resource-001", "resource-002", "resource-003",
              "age-001", "age-002", "age-003", "age-004",
              "safety-001", "safety-002", "safety-003", "provider-001",
              "cost-001", "privacy-002",
          }
          missing = sorted(required_tests - test_ids)
          if missing:
              raise SystemExit("Missing DCDS Super Intelligence evaluation tests: " + ", ".join(missing))
          if not knowledge.get("assistant_policy", {}).get("current_state"):
              raise SystemExit("DCDS AI knowledge base has no current state policy.")
          print("Validated DCDS knowledge JSON and required GPT, youth-safety, resource-action and memory evaluations.")
          PY
