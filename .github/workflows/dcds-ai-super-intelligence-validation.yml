name: DCDS Super Intelligence validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "ai-learning-assistant.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"
  push:
    branches:
      - main
      - feature/dcds-super-intelligence
    paths:
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "ai-learning-assistant.html"
      - "dcds-ai-knowledge-base.json"
      - "ai-config/**"
      - ".github/workflows/dcds-ai-super-intelligence-validation.yml"

permissions:
  contents: read

concurrency:
  group: dcds-super-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check DCDS AI Edge Functions
        run: |
          deno check supabase/functions/dcds-ai-chat/index.ts
          deno check supabase/functions/dcds-ai-speech-session/index.ts

      - name: Validate live retrieval, privacy boundaries and evaluation coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          function_path = Path("supabase/functions/dcds-ai-chat/index.ts")
          function = function_path.read_text(encoding="utf-8")
          start = function.index("async function searchPlatformKnowledge(")
          end = function.index("// Discover model names dynamically", start)
          search_helper = function[start:end]
          ai_page = Path("ai-learning-assistant.html").read_text(encoding="utf-8")
          submit_handler = ai_page.split("form.addEventListener('submit'", 1)[1].split(" });\n})();", 1)[0]

          allowed_tables = (
              'from("courses")',
              'from("public_announcements")',
              'from("dcds_reviews")',
              'from("enrollments")',
              'from("course_lessons")',
              'from("course_materials")',
          )
          for table in allowed_tables:
              if table not in search_helper:
                  raise SystemExit(f"Live retrieval helper is missing approved source: {table}")

          forbidden_tables = (
              'from("payments")',
              'from("orders")',
              'from("profiles")',
              'from("dcds_referrals")',
              'from("dcds_reward_ledger")',
              'from("dcds_payout_requests")',
              'from("dcds_international_payout_requests")',
              'from("student_support_tickets")',
              'from("student_admin_notes")',
              'from("quiz_answer_keys")',
              'from("quiz_attempt_answers")',
          )
          for table in forbidden_tables:
              if table in search_helper:
                  raise SystemExit(f"Disallowed private/financial retrieval source found: {table}")

          invariants = {
              "public guest mode is verified server-side as an anonymous or unverified session":
                  'const isGuest = anonymous || !verifiedContact' in function
                  and "body.adult_confirmation !== true" in function,
              "adult AI access does not depend on the global approval switch":
                  "dcds_ai_access_settings" not in function
                  and 'eligibility?.age_band === "18_plus"' in function,
              "teen access still requires approved independent guardian consent":
                  'eligibility?.age_band === "13_17"' in function
                  and 'eligibility.guardian_consent_status === "verified"' in function
                  and "guardian_consent_reference" in function
                  and "Under-13 DCDS AI access is not available" in function,
              "guest platform search excludes private enrolled lessons":
                  'if (role === "student")' in search_helper,
              "guest and student chat history persistence remain separate":
                  'if (role === "student") {' in function
                  and "dcds_ai_conversations" in function
                  and "dcds_ai_student_memory" in function,
              "visitor message volume has a stricter per-session allowance":
                  'role === "guest" ? 3' in function
                  and 'role === "guest" ? 5' in function
                  and "p_daily_limit" in function,
              "provider quota exhaustion returns a dedicated recoverable code":
                  "PROVIDER_DAILY_QUOTA" in function
                  and "no-cost provider allowance" in function,
              "message send failures retain the draft and keep the mobile keyboard closed":
                  "your draft is still in the message box" in ai_page
                  and "input.blur()" in ai_page
                  and "input.focus()" not in submit_handler,
              "student lesson retrieval is scoped to the student's own enrollments":
                  '.from("enrollments").select("course_id").eq("user_id", userId)' in search_helper
                  and '.in("course_id", courseIds)' in search_helper,
              "announcements are published and time-scoped":
                  '.eq("status", "published")' in search_helper
                  and '.lte("starts_at", now)' in search_helper
                  and "currentAnnouncements" in search_helper,
              "reviews are approval-filtered":
                  '.eq("is_approved", true)' in search_helper,
              "Gemini model catalogue is discovered dynamically":
                  "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100" in function
                  and "supportedGenerationMethods" in function,
              "Google Search is opt-in/freshness-triggered":
                  "wantsExternalWebSearch(promptMessage, role)" in function
                  and "google_search: {}" in function,
              "grounded source links are returned":
                  "groundingMetadata" in function and "Sources checked:" in function,
              "general learning is not limited to the static brain":
                  "Do not limit useful teaching to facts in the DCDS knowledge files" in function,
              "shared DCDS facts require official source confirmation":
                  "If a DCDS-specific fact cannot be confirmed" in Path("ai-config/DCDS-MASTER-BRAIN.md").read_text(encoding="utf-8"),
              "student memory remains owner-controlled":
                  "dcds_ai_student_memory" in function
                  and "user.id" in function,
              "image data is sent to Gemini as transient inline data":
                  "inlineData" in function and "imageAttachment" in function,
              "image file type, size and signature are checked":
                  "maxImageBytes" in function and "allowedImageTypes" in function
                  and "isJpeg" in function and "isPng" in function and "isWebp" in function,
              "uploaded image files are not stored in DCDS chat history":
                  "The image file itself is not stored in DCDS chat history" in function,
              "image history markers tell the assistant to request reattachment":
                  "ask them to attach it again" in function,
              "voice dictation remains available through browser speech recognition":
                  "SpeechRecognition" in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "spoken replies use free browser/device speech rather than a paid speech API":
                  "Listen · free voice" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "speechSynthesis" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "dcds-ai-speech-session" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "OpenAI voice sessions use server-mediated WebRTC SDP exchange":
                  "https://api.openai.com/v1/realtime/calls" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "FormData()" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "body: formData" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "natural female-style DCDS voice uses the recommended Realtime model and Marin voice":
                  "gpt-realtime-2.1-mini" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and 'voice: "marin"' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "OpenAI voice sessions are protected by verified-account and age access checks":
                  "getUser()" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "is_dcds_admin" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "guardian_consent_status" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "OpenAI voice generation is usage-limited and keeps the project key server-side":
                  "dcds_consume_ai_request" in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and 'Deno.env.get("OPENAI_API_KEY")' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "The browser receives only the SDP answer, not an OpenAI credential":
                  'return json({ success: true, sdp: answerSdp, voice: "marin" })' in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "client_secret" not in Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8")
                  and "data.client_secret" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "The public AI page does not invoke the dormant paid speech endpoint":
                  "dcds-ai-speech-session" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "api.openai.com" not in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "natural voice tests are present":
                  "voice-002" in Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8")
                  and "voice-003" in Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8"),
              "image upload UI is connected to the chat request":
                  "attachImageButton" in Path("ai-learning-assistant.html").read_text(encoding="utf-8")
                  and "requestBody.image" in Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
          }
          failures = [name for name, passed in invariants.items() if not passed]
          for name, passed in invariants.items():
              print(("PASS " if passed else "FAIL ") + name)
          if failures:
              raise SystemExit(f"{len(failures)} DCDS Super Intelligence invariants failed.")

          knowledge = json.loads(Path("dcds-ai-knowledge-base.json").read_text(encoding="utf-8"))
          evaluation = json.loads(Path("ai-config/DCDS-AI-EVALUATION-TESTS.json").read_text(encoding="utf-8"))
          test_ids = {item.get("id") for item in evaluation.get("tests", [])}
          required_tests = {
              "retrieval-001", "retrieval-002", "retrieval-003",
              "learning-003", "web-001", "memory-001", "memory-002", "security-002",
              "image-001", "image-002", "voice-001", "voice-002", "voice-003",
              "guest-001", "guest-002", "chat-001",
          }
          missing = sorted(required_tests - test_ids)
          if missing:
              raise SystemExit("Missing DCDS Super Intelligence evaluation tests: " + ", ".join(missing))
          if not knowledge.get("assistant_policy", {}).get("current_state"):
              raise SystemExit("DCDS AI knowledge base has no current state policy.")
          print("Validated DCDS AI knowledge JSON and all required Super Intelligence evaluation cases.")
          PY
