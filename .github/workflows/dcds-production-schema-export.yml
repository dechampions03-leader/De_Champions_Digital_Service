name: DCDS Production Schema and Customization Audit (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase1-security-reliability
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/dcds-production-schema-export.yml"

permissions:
  contents: read

concurrency:
  group: dcds-production-schema-audit
  cancel-in-progress: false

jobs:
  export-production-baseline:
    name: Capture schema and managed-schema customizations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secret
        env:
          DCDS_PRODUCTION_DB_URL: ${{ secrets.DCDS_PRODUCTION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DCDS_PRODUCTION_DB_URL}" ]]; then
            echo "Missing repository secret: DCDS_PRODUCTION_DB_URL"
            exit 1
          fi
          case "${DCDS_PRODUCTION_DB_URL}" in
            postgres://*|postgresql://*) ;;
            *) echo "The production database URL is not a PostgreSQL URI."; exit 1 ;;
          esac

      - name: Export public schema definitions (schema only)
        env:
          DCDS_PRODUCTION_DB_URL: ${{ secrets.DCDS_PRODUCTION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --remote="${DCDS_PRODUCTION_DB_URL}" \
            --schema public \
            --file dcds-production-public-schema.sql
          test -s dcds-production-public-schema.sql
          if grep -Eiq '^(INSERT INTO|COPY .* FROM stdin)' dcds-production-public-schema.sql; then
            echo "Unexpected top-level data statements found."
            exit 1
          fi

      - name: Capture complete custom schema diff, including managed-schema hooks
        env:
          DCDS_PRODUCTION_DB_URL: ${{ secrets.DCDS_PRODUCTION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${RUNNER_TEMP}/dcds-baseline-diff"
          mkdir -p "${WORKSPACE}"
          cd "${WORKSPACE}"

          # Recent Supabase init enables pg-delta by default. The diff runs against
          # an empty shadow baseline and does not write to the remote production DB.
          supabase init --force
          grep -q '\[experimental.pgdelta\]' supabase/config.toml
          grep -q 'enabled = true' supabase/config.toml

          supabase db diff \
            --remote="${DCDS_PRODUCTION_DB_URL}" \
            --strict-coverage > "${GITHUB_WORKSPACE}/dcds-production-complete-baseline.sql"

          cd "${GITHUB_WORKSPACE}"
          test -s dcds-production-complete-baseline.sql

          # Check the SQL is a schema diff, not a data export.
          if grep -Eiq '^(INSERT INTO|COPY .* FROM stdin)' dcds-production-complete-baseline.sql; then
            echo "Unexpected top-level data statements found in schema diff."
            exit 1
          fi

          public_triggers="$(grep -Eic '^CREATE( OR REPLACE)? TRIGGER ' dcds-production-complete-baseline.sql || true)"
          if [[ "${public_triggers}" -lt 7 ]]; then
            echo "Expected all seven DCDS public triggers; found ${public_triggers}."
            exit 1
          fi

          if ! grep -Eiq 'dcds_capture_referral_after_signup|capture_dcds_referral_on_signup' dcds-production-complete-baseline.sql; then
            echo "DCDS auth.users referral trigger customization was not captured."
            exit 1
          fi

          echo "Complete schema diff captured. Public trigger DDL count: ${public_triggers}."

      - name: Upload reviewed schema artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcds-production-schema-and-customizations
          path: |
            dcds-production-public-schema.sql
            dcds-production-complete-baseline.sql
          if-no-files-found: error
          retention-days: 7
