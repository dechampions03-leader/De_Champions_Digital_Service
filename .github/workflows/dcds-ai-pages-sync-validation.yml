name: DCDS GitHub Pages AI sync validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai-learning-assistant.html"
      - "dcds-ai-access-review.html"
      - "admin-notifications.html"
      - "student-dashboard.html"
      - "student-management.html"
      - "privacy-policy.html"
      - "index.html"
      - "ai-config/captcha-public-config.js"
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-token/**"
      - "supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql"
      - "supabase/migrations/20261113160210_dcds_ai_age_policy_autoapproval_guard.sql"
      - ".github/workflows/dcds-ai-pages-sync-validation.yml"

permissions:
  contents: read

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published DCDS AI pages and project wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              "ai": Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "review": Path("dcds-ai-access-review.html").read_text(encoding="utf-8"),
              "admin": Path("admin-notifications.html").read_text(encoding="utf-8"),
              "dashboard": Path("student-dashboard.html").read_text(encoding="utf-8"),
              "privacy": Path("privacy-policy.html").read_text(encoding="utf-8"),
              "home": Path("index.html").read_text(encoding="utf-8"),
              "captcha": Path("ai-config/captcha-public-config.js").read_text(encoding="utf-8"),
              "student-management": Path("student-management.html").read_text(encoding="utf-8"),
              "edge": Path("supabase/functions/dcds-ai-chat/index.ts").read_text(encoding="utf-8"),
              "speech": Path("supabase/functions/dcds-ai-speech-token/index.ts").read_text(encoding="utf-8"),
              "age-policy-migration": Path("supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql").read_text(encoding="utf-8"),
          }
          production_url = "https://qxsenflgaweeadvggnyp.supabase.co"
          development_ref = "tjgsxbmkpvktlqulbktv"

          checks = {
              "AI chat page points to Production Supabase": production_url in files["ai"],
              "Admin review page points to Production Supabase": production_url in files["review"],
              "No Development project URL is embedded in published pages": all(development_ref not in value for value in files.values()),
              "AI access review form is present": "dcds_ai_access_eligibility" in files["ai"] and "aiEligibilityPanel" in files["ai"],
              "Admin access review screen is noindex": "noindex" in files["review"].lower() and "nofollow" in files["review"].lower(),
              "Admin Centre links to the access review screen": 'href="dcds-ai-access-review.html"' in files["admin"],
              "Student dashboard links to DCDS AI": 'href="ai-learning-assistant.html?source=student-dashboard"' in files["dashboard"],
              "Admin dashboard links directly to AI Access Review": 'href="dcds-ai-access-review.html"' in files["student-management"] and "is_dcds_admin" in files["student-management"],
              "Homepage retains its public AI entry point": "ai-learning-assistant.html" in files["home"],
              "Main login page loads the Turnstile public configuration": 'src="ai-config/captcha-public-config.js"' in files["home"],
              "Turnstile UI and token validation hooks are present": "dcdsCaptchaMarkup" in files["home"] and "getDcdsCaptchaToken" in files["home"],
              "Turnstile widget is visible when enabled": 'appearance:"always"' in files["home"],
              "Supabase signup, login and reset receive CAPTCHA tokens": "captchaToken" in files["home"] and "signInWithPassword(signInCredentials)" in files["home"] and "options:{captchaToken}" in files["home"] and "resetPasswordForEmail(email,{redirectTo,...(captchaToken?{captchaToken}:{})})" in files["home"],
              "Turnstile login waits for and reads a completed widget token": "turnstile.getResponse(dcdsAuthTurnstileWidgetId)" in files["home"] and "Cloudflare is still verifying" in files["home"],
              "Administrator AI access bypasses student eligibility review": "if(isAdmin)" in files["ai"] and "setChatEnabled(true)" in files["ai"],
              "Global AI age controls exist in the admin dashboard": "aiTeenAccessToggle" in files["student-management"] and "aiAdultAccessToggle" in files["student-management"],
              "Global adult and teen policy is enforced server-side": "dcds_ai_access_settings" in files["edge"] and "eligibility.guardian_consent_status === \"verified\"" in files["edge"] and "role === \"student\"" in files["edge"],
              "Age policy database migration is present": "create table if not exists public.dcds_ai_access_settings" in files["age-policy-migration"],
              "Production CAPTCHA activation is enabled after Supabase Auth secret is configured": 'authProtectionEnabled: true' in files["captcha"],
              "Privacy notice identifies the Gemini provider": "Google Gemini API" in files["privacy"],
              "Privacy notice warns about free-tier human review": "human reviewers" in files["privacy"].lower(),
              "Privacy notice explains image attachment processing": "image attachments" in files["privacy"].lower() and "not stored as image files" in files["privacy"],
              "Privacy notice explains optional browser voice processing": "speech-recognition" in files["privacy"] and "raw microphone recording" in files["privacy"],
              "Privacy notice explains OpenAI Realtime voice processing": "OpenAI Realtime API" in files["privacy"] and "gpt-realtime-2.1-mini" in files["privacy"] and "30 days" in files["privacy"],
              "DCDS AI page includes image attachment and voice input controls": "attachImageButton" in files["ai"] and "voiceButton" in files["ai"],
              "DCDS AI page provides OpenAI natural spoken response controls": "dcds-ai-speech-token" in files["ai"] and "Listen · AI voice" in files["ai"] and "speechSynthesis" not in files["ai"],
              "OpenAI voice session is JWT-protected and age-gated": "getUser()" in files["speech"] and "guardian_consent_status" in files["speech"],
              "OpenAI voice API key stays server-side": 'Deno.env.get("OPENAI_API_KEY")' in files["speech"],
              "Teen access remains disabled and under-13 blocked": "13–17" in files["privacy"] and "Under-13 AI access remains blocked" in files["privacy"],
          }
          for name, passed in checks.items():
              print(("PASS " if passed else "FAIL ") + name)
          failures = [name for name, passed in checks.items() if not passed]
          if failures:
              raise SystemExit(f"{len(failures)} GitHub Pages release checks failed.")

          for page_name in ("index.html", "ai-learning-assistant.html", "dcds-ai-access-review.html"):
              html = Path(page_name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {page_name}.")
              for index, script in enumerate(scripts):
                  if script.strip():
                      Path(f"/tmp/{Path(page_name).stem}-{index}.js").write_text(script, encoding="utf-8")
          print("Validated GitHub Pages wiring and DCDS AI release gates.")
          PY
          for script in /tmp/ai-learning-assistant-*.js /tmp/dcds-ai-access-review-*.js; do
            [ -f "$script" ] && node --check "$script"
          done
