name: DCDS GitHub Pages AI sync validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai-learning-assistant.html"
      - "dcds-ai-access-review.html"
      - "admin-notifications.html"
      - "student-dashboard.html"
      - "student-management.html"
      - "privacy-policy.html"
      - "index.html"
      - "ai-config/captcha-public-config.js"
      - "ai-config/DCDS-MASTER-BRAIN.md"
      - "ai-config/DCDS-AI-MEMORY-GOVERNANCE.md"
      - "ai-config/DCDS-RESPONSE-PLAYBOOK.md"
      - "ai-config/DCDS-AI-EVALUATION-TESTS.json"
      - "dcds-ai-knowledge-base.json"
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql"
      - "supabase/migrations/20261113160210_dcds_ai_age_policy_autoapproval_guard.sql"
      - "supabase/migrations/20261124130000_dcds_ai_root_admin_identity.sql"
      - "supabase/migrations/20261125120000_dcds_ai_superintendent_one_year_memory.sql"
      - "supabase/migrations/20261125170000_dcds_superintendent_admin_display.sql"
      - "supabase/migrations/20261125180000_dcds_verified_superintendent_ceo_identity.sql"
      - "supabase/migrations/20261125190000_dcds_founder_ceo_owner_identity_registry.sql"
      - ".github/workflows/dcds-ai-pages-sync-validation.yml"

permissions:
  contents: read

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published DCDS AI pages and project wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              "ai": Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "review": Path("dcds-ai-access-review.html").read_text(encoding="utf-8"),
              "admin": Path("admin-notifications.html").read_text(encoding="utf-8"),
              "dashboard": Path("student-dashboard.html").read_text(encoding="utf-8"),
              "privacy": Path("privacy-policy.html").read_text(encoding="utf-8"),
              "home": Path("index.html").read_text(encoding="utf-8"),
              "captcha": Path("ai-config/captcha-public-config.js").read_text(encoding="utf-8"),
              "student-management": Path("student-management.html").read_text(encoding="utf-8"),
              "edge": Path("supabase/functions/dcds-ai-chat/index.ts").read_text(encoding="utf-8"),
              "speech": Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "age-policy-migration": Path("supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql").read_text(encoding="utf-8"),
              "superintendent-auth-migration": Path("supabase/migrations/20261124130000_dcds_ai_root_admin_identity.sql").read_text(encoding="utf-8"),
              "owner-memory-migration": Path("supabase/migrations/20261125120000_dcds_ai_superintendent_one_year_memory.sql").read_text(encoding="utf-8"),
              "superintendent-display-migration": Path("supabase/migrations/20261125170000_dcds_superintendent_admin_display.sql").read_text(encoding="utf-8"),
              "founder-identity-migration": Path("supabase/migrations/20261125180000_dcds_verified_superintendent_ceo_identity.sql").read_text(encoding="utf-8"),
              "founder-owner-registry-migration": Path("supabase/migrations/20261125190000_dcds_founder_ceo_owner_identity_registry.sql").read_text(encoding="utf-8"),
              "brain": Path("ai-config/DCDS-MASTER-BRAIN.md").read_text(encoding="utf-8"),
              "memory": Path("ai-config/DCDS-AI-MEMORY-GOVERNANCE.md").read_text(encoding="utf-8"),
              "playbook": Path("ai-config/DCDS-RESPONSE-PLAYBOOK.md").read_text(encoding="utf-8"),
              "knowledge": Path("dcds-ai-knowledge-base.json").read_text(encoding="utf-8"),
          }
          production_url = "https://qxsenflgaweeadvggnyp.supabase.co"
          development_ref = "tjgsxbmkpvktlqulbktv"
          submit_handler = files["ai"].split("form.addEventListener('submit'", 1)[1].split(" });\n})();", 1)[0]
          release_tracker = (
              files["student-management"].split('id="dcdsReleaseReadiness"', 1)[1].split("</section>", 1)[0]
              if 'id="dcdsReleaseReadiness"' in files["student-management"] else ""
          )

          checks = {
              "AI chat page points to Production Supabase": production_url in files["ai"],
              "Admin review page points to Production Supabase": production_url in files["review"],
              "Cloudflare Admin previews select the Development Supabase project only on the dedicated Pages preview host": (
                'window.location.hostname === "dcds-dev-auth-preview.pages.dev"' in files["student-management"]
                and 'window.location.hostname.endsWith(".dcds-dev-auth-preview.pages.dev")' in files["student-management"]
                and 'const SUPABASE_URL = DCDS_DEV_PREVIEW_HOST' in files["student-management"]
                and "https://tjgsxbmkpvktlqulbktv.supabase.co" in files["student-management"]
                and "sb_publishable_HHR1gFS6wHvljkTZ0nLWMw_7kfVM3Mn" in files["student-management"]
                and '  : "https://qxsenflgaweeadvggnyp.supabase.co"' in files["student-management"]
                and '  : "sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP"' in files["student-management"]
            ),
            "No Development project URL is embedded in the other published pages": all(
                development_ref not in value for key, value in files.items() if key != "student-management"
            ),
              "Public guest entry is visible and visitor mode cannot display private student tools": "guestAccessPanel" in files["ai"] and "studentTools.hidden=true" in files["ai"] and "visitor chats are temporary" in files["ai"],
              "AI access review form is present": "dcds_ai_access_eligibility" in files["ai"] and "aiEligibilityPanel" in files["ai"],
              "Admin access review screen is noindex": "noindex" in files["review"].lower() and "nofollow" in files["review"].lower(),
              "Admin Centre links to the access review screen": 'href="dcds-ai-access-review.html"' in files["admin"],
              "Student dashboard links to DCDS AI": 'href="ai-learning-assistant.html?source=student-dashboard"' in files["dashboard"],
              "Admin dashboard links directly to AI Access Review": 'href="dcds-ai-access-review.html"' in files["student-management"] and "is_dcds_admin" in files["student-management"],
              "Homepage retains its public AI entry point": "ai-learning-assistant.html" in files["home"],
              "Production readiness tracker is located in the Admin overview": bool(release_tracker) and 'id="dcdsReleaseReadiness" data-admin-view-panel="overview"' in files["student-management"],
              "Production readiness tracker has exactly six release gates": release_tracker.count('class="release-gate"') == 6,
              "Production readiness tracker keeps sandbox, production review and launch approval pending": all(term in release_tracker for term in ("Sandbox &amp; integration", "Production readiness review", "Launch approval", "NOT APPROVED", "PENDING")),
              "Main admin dashboard exposes a direct Student Support & Resolution route": 'href="admin-notifications.html?view=support"' in files["student-management"] and "Student Support &amp; Resolution" in files["student-management"],
              "Student Support & Resolution is the first quick-access workspace": (
                  'href="admin-notifications.html?view=support"' in files["student-management"].split('<section class="panel admin-quick-access"', 1)[1].split('</section>', 1)[0]
                  and files["student-management"].split('<section class="panel admin-quick-access"', 1)[1].split('</section>', 1)[0].index('href="admin-notifications.html?view=support"')
                  < files["student-management"].split('<section class="panel admin-quick-access"', 1)[1].split('</section>', 1)[0].index('data-admin-view="students"')
              ),
              "Student lookup accepts a registered email or mobile and automatically resolves the matched identity": "supportLookupInput" in files["admin"] and "admin_lookup_student_for_support" in files["admin"] and "setTimeout(() => lookupSupportStudent" in files["admin"] and "renderSupportStudentMatch(data.student)" in files["admin"],
              "Support workflow opens a case and supports replies plus resolved/closed statuses": "admin_create_student_support_case" in files["admin"] and "admin_update_student_support_ticket" in files["admin"] and '["resolved","Resolved"]' in files["admin"] and '["closed","Closed"]' in files["admin"],
              "Support inbox does not expose raw internal student UUIDs": '"Student ID: " + ticket.user_id' not in files["admin"] and "Student identity not loaded in this view" in files["admin"],
              "Main login page loads the Turnstile public configuration": 'src="ai-config/captcha-public-config.js"' in files["home"],
              "Turnstile UI and token validation hooks are present": "dcdsCaptchaMarkup" in files["home"] and "getDcdsCaptchaToken" in files["home"],
              "Turnstile widget is visible when enabled": 'appearance:"always"' in files["home"],
              "Supabase signup, login and reset receive CAPTCHA tokens": "captchaToken" in files["home"] and "signInWithPassword(signInCredentials)" in files["home"] and "options:{captchaToken}" in files["home"] and "resetPasswordForEmail(email,{redirectTo,...(captchaToken?{captchaToken}:{})})" in files["home"],
              "Turnstile login waits for and reads a completed widget token": "turnstile.getResponse(dcdsAuthTurnstileWidgetId)" in files["home"] and "Cloudflare is still verifying" in files["home"],
              "Administrator AI access bypasses student eligibility review": "if(isAdmin)" in files["ai"] and "setChatEnabled(true)" in files["ai"],
              "Admin AI access panel explains retired adult global toggles and preserves the guardian review link": "adult global approval switches have been retired" in files["student-management"] and "dcds-ai-access-review.html" in files["student-management"] and "aiAdultAccessToggle" not in files["student-management"] and "aiTeenAccessToggle" not in files["student-management"],
              "Adult visitors can use public AI without a DCDS student account": "guestAccessPanel" in files["ai"] and "signInAnonymously" in files["ai"] and "dcdsGuestCaptcha" in files["ai"],
              "Anonymous visitor creation is protected by Turnstile": "captcha-public-config.js" in files["ai"] and "captchaToken:guestCaptchaToken" in files["ai"] and "appearance:'always'" in files["ai"],
              "Guest messages carry an explicit adult confirmation": "adult_confirmation=true" in files["ai"] and "body.adult_confirmation !== true" in files["edge"],
              "Guests cannot access student-only saved history or enrolled lessons": 'if (role === "student")' in files["edge"] and "data.role==='guest'" in files["ai"] and "isGuestSession=true" in files["ai"],
              "Adults do not require a second global access switch": "dcds_ai_access_settings" not in files["edge"],
              "Gemini-backed DCDS AI is server-gated to signed-in adults aged 18+": 'eligibility?.age_band === "18_plus"' in files["edge"] and "UNDER_18_AI_UNAVAILABLE" in files["edge"] and "guardian_consent_status === \"verified\"" not in files["edge"],
              "Visitors explicitly confirm 18+ and signed-in admins use saved eligibility records": "body.adult_confirmation !== true" in files["edge"] and "guestAdultConfirm" in files["ai"] and "loadAdminAiEligibility" in files["ai"] and "guardian_consent_status" in files["edge"] and "adminAdultAllowed" in files["edge"],
              "Visitor mode does not return before the chat form handler is attached": "await showGuestAccess();" in files["ai"] and "await showGuestAccess();return" not in files["ai"],
              "Signed-in welcome greeting is personalised from profile full_name": "user_metadata" in files["ai"] and "configureWelcomeGreeting" in files["ai"],
              "Superintendent Admin authorization is verified only through the protected database role": "is_dcds_super_admin" in files["edge"] and "isSuperintendentAdmin" in files["edge"] and "a.role = 'super_admin'" in files["superintendent-auth-migration"] and "public.dcds_admins" in files["superintendent-auth-migration"],
              "Deyriva receives verified Superintendent Admin guidance and reports the role to the UI": "VERIFIED DCDS SUPERINTENDENT ADMIN" in files["edge"] and "is_superintendent_admin: isSuperintendentAdmin" in files["edge"] and "data.is_superintendent_admin===true" in files["ai"],
              "DCDS AI page displays Superintendent Admin status only after the authenticated owner-role RPC": "client.rpc('is_dcds_super_admin')" in files["ai"] and "Superintendent Admin" in files["ai"],
              "Deyriva uses a neutral initial account label and displays the Founder & CEO header only after the designated-owner RPC succeeds": "Verifying your DCDS account…" in files["ai"] and "Verifying your student account…" not in files["ai"] and "client.rpc('dcds_get_verified_superintendent_identity')" in files["ai"] and "founderIdentityData?.designated_owner_mapping_verified===true" in files["ai"] and "Founder & CEO · Superintendent Admin" in files["ai"],
              "Saved Superintendent Admin 18+ record automatically enables Deyriva": "loadAdminAiEligibility" in files["ai"] and "await enterAdminAi(true)" in files["ai"] and "age_band==='18_plus'" in files["ai"] and "guardian_consent_status==='not_required'" in files["ai"],
              "First-time admin adult confirmation is saved to the authenticated account": "dcds_ai_access_eligibility').insert({user_id:currentUser.id,age_band:'18_plus'})" in files["ai"],
              "An under-18 admin record cannot be overridden by a browser confirmation flag": "const under18 = adminEligibility?.age_band === \"13_17\" || adminEligibility?.age_band === \"under_13\"" in files["edge"] and "UNDER_18_AI_UNAVAILABLE" in files["edge"],
              "Student dashboard motion-off prevents legacy reveal scripts and retains deliberate pull-to-refresh": (files["dashboard"].count('if(document.getElementById("dcds-student-dashboard-motion-off")) return;') == 2) and "const threshold=112;" in files["dashboard"],
              "Student AI card discloses the adult-only AI rule without limiting course access": "adults aged 18+" in files["dashboard"] and "This does not restrict access to DCDS courses." in files["dashboard"],
              "Deyriva owner descriptor is preserved beside the official CEO and Superintendent Admin titles": "Founder & CEO · Superintendent Admin · Deyriva owner" in files["ai"] and "founderIdentityData?.designated_owner_mapping_verified===true" in files["ai"] and "Director · Deyriva owner" not in files["ai"],
              "Verified founder questions receive the exact explicit owner answer": "asksWhoFoundedDeyriva" in files["edge"] and "Gladly, Sir! It is you, Jeremiah Chuks Godspower (De Champions)" in files["edge"] and "isVerifiedFounderCeo && asksWhoFoundedDeyriva" in files["edge"],
              "Homepage resolves administrator access only after a server-side role check": "refreshDcdsAccountButton" in files["home"] and "rpc('is_dcds_admin')" in files["home"] and "Admin Portal" in files["home"] and "if(dcdsAccountRole==='admin')" in files["home"],
              "Administrator portal wording is consistent across the main admin workspaces": "DCDS Administration Portal | Communications" in files["admin"] and "DCDS Administration Portal" in files["student-management"] and "Administration Portal" in files["dashboard"],
                            "Founder & CEO is restricted to the unique designated owner account, not any future super_admin": "dcds_verified_owner_identities" in files["founder-owner-registry-migration"] and "ENABLE ROW LEVEL SECURITY" in files["founder-owner-registry-migration"] and "REVOKE ALL ON TABLE public.dcds_verified_owner_identities FROM authenticated" in files["founder-owner-registry-migration"] and "count(*)" in files["founder-owner-registry-migration"] and "oi.user_id = v_user_id" in files["founder-owner-registry-migration"] and "designated_owner_mapping_verified === true" in files["edge"],
"Founder & CEO identity is verified for the current auth account through confirmed email and protected owner credentials": "dcds_get_verified_superintendent_identity" in files["edge"] and "ownerIdentity.email_verified === true" in files["edge"] and "email_confirmed_at IS NOT NULL" in files["founder-identity-migration"] and "public.is_dcds_super_admin()" in files["founder-identity-migration"],
              "Deyriva carries verified Founder & CEO identity into every owner response without exposing the email": "verifiedFounderCeoGuidance" in files["edge"] and "Never reveal, quote, repeat or include the actual sign-in email address" in files["edge"] and "is_founder_ceo_verified: isVerifiedFounderCeo" in files["edge"],
              "Owner identity questions include natural language and common wording mistakes": "isOwnerIdentityQuestion" in files["edge"] and "who\\s+(?:am\\s+i|i\\s+am|i\\s+my)" in files["edge"],
              "Superintendent Admin is the platform-wide display title": "DCDS Superintendent Admin" in files["knowledge"] and "Superintendent Admin" in files["superintendent-display-migration"] and "Superintendent Admin" in files["edge"],
              "Operational snapshot returns a display label, not an internal root role": "'superintendent_admin'" in files["superintendent-display-migration"] and "'admin_role', CASE WHEN a.role = 'super_admin' THEN 'Superintendent Admin' ELSE initcap(replace(a.role, '_', ' ')) END" in files["superintendent-display-migration"],
              "The protected super_admin authorization remains intact": "public.is_dcds_super_admin()" in files["superintendent-display-migration"] and "a.role = 'super_admin'" in files["superintendent-auth-migration"],
              "Deyriva addresses the verified Superintendent Admin by the requested title": "Hello, Superintendent Admin." in files["ai"] and "Address this person exactly as" in files["edge"],
              "Deyriva does not volunteer the Superintendent Admin account holder's Founder/CEO identity": "Do not volunteer or casually mention their Founder/CEO identity" in files["edge"],
              "Financial escalation protocol is present in the response playbook": "Financial and Sensitive Account Escalations" in files["playbook"] and "student-dashboard.html#studentSupportPanel" in files["playbook"] and "admin-notifications.html#supportInboxSection" in files["playbook"],
              "Operational snapshot reporting standard requires timestamp, findings, recommendations and unchecked systems": "Operational Snapshot Reporting Standard" in files["playbook"] and all(term in files["playbook"] for term in ("Snapshot timestamp", "Evidence-based findings", "Recommendations and next steps", "Systems not checked")),
              "Verified Superintendent Admin title preserves the protected super_admin role": "Superintendent Admin" in files["brain"] and "super_admin" in files["edge"] and "is_dcds_super_admin" in files["edge"] and "Superintendent Admin" in files["ai"],
              "Superintendent Admin is the only owner salutation shown in verified owner greeting": "Hello, Superintendent Admin." in files["ai"] and "Address this person exactly as" in files["edge"] and "VERIFIED DCDS SUPERINTENDENT ADMIN" in files["edge"],
              "Superintendent Admin conversations persist only for the server-verified owner": "role === \"admin\" && isSuperintendentAdmin" in files["edge"] and "canPersistConversation" in files["edge"] and "isPersistentOwner=true" in files["ai"],
              "Superintendent Admin one-year memory search is owner-scoped and bounded": "dcds_ai_search_superintendent_memory" in files["edge"] and "interval '365 days'" in files["owner-memory-migration"] and "SECURITY INVOKER" in files["owner-memory-migration"] and "public.is_dcds_super_admin()" in files["owner-memory-migration"] and "auth.uid()" in files["owner-memory-migration"],
              "Superintendent Admin archive excludes financial/account-secret text": "payment|payments|payout|payouts|wallet|bank|transaction|refund|receipt|beneficiary|card|cvv|otp|password|account number|balance" in files["owner-memory-migration"],
              "Superintendent Admin short-term and historical context exclude financial/account-secret text": "safeStoredMessages" in files["edge"] and "safeRecentMessages" in files["edge"] and "safeMemoryMatches" in files["edge"],
              "Ordinary admins and visitors remain without persistent conversation history": "role === \"admin\" && isSuperintendentAdmin" in files["edge"] and "isPersistentOwner=false" in files["ai"],
              "Superintendent Admin history controls explain 365-day private recall": "365-day recall" in files["ai"] and "previous 365 days" in files["ai"],
              "Conversation memory governance documents one-year owner archive": "Superintendent Admin long-term conversation memory" in files["memory"] and "365 days" in files["memory"],
              "Student self-identity uses the current account profile and own enrolments only": "studentIdentityGuidance" in files["edge"] and "needsIdentity" in files["edge"] and "own_enrolments" in files["edge"],
              "Fresh student chats carry forward only the latest private conversation": "RECENT PRIVATE STUDENT CONVERSATION CONTINUITY" in files["edge"] and '.eq("user_id", user.id)' in files["edge"] and ".limit(10)" in files["edge"],
              "Deyriva's approved knowledge includes a route-aware platform directory": '"platform_directory"' in files["knowledge"] and "student_programmes" in files["knowledge"] and "administrative_workspaces" in files["knowledge"],
              "AI memory governance documents owner-scoped cross-chat continuity": "Cross-chat continuity" in files["memory"] and "same student's most recently active saved conversation" in files["memory"],
              "Master Brain and Response Playbook use Superintendent Admin title without changing internal role verification": "Superintendent Admin" in files["brain"] and "Do not volunteer the Founder/CEO identity" in files["playbook"],
              "Failed chat sends preserve the draft and do not reopen the mobile keyboard": "your draft is still in the message box" in files["ai"] and "input.blur()" in files["ai"] and "input.focus()" not in submit_handler,
              "AI pagehide cleanup references a defined function so the submit handler can register": "function stopSpeechPlayback()" in files["ai"] and "window.addEventListener('pagehide',stopSpeechPlayback)" in files["ai"] and "stopOpenAiSpeech" not in files["ai"],
              "Public visitor processing and temporary chats are disclosed": "visitor chat transcripts" in files["privacy"] and "temporary anonymous session" in files["privacy"],
              "Age policy database migration is present": "create table if not exists public.dcds_ai_access_settings" in files["age-policy-migration"],
              "Production CAPTCHA activation is enabled after Supabase Auth secret is configured": 'authProtectionEnabled: true' in files["captcha"],
              "Privacy notice identifies the Gemini provider": "Google Gemini API" in files["privacy"],
              "Deyriva's free provider pool includes Google-hosted Gemma 4 fallbacks": '"gemma-4-26b-a4b-it"' in files["edge"] and '"gemma-4-31b-it"' in files["edge"],
              "Privacy notice warns about free-tier human review": "human reviewers" in files["privacy"].lower(),
              "Privacy notice explains image attachment processing": "image attachments" in files["privacy"].lower() and "not stored as image files" in files["privacy"],
              "Privacy notice explains optional browser voice processing": "speech-recognition" in files["privacy"] and "raw microphone recording" in files["privacy"],
              "Privacy notice explains optional device voice playback": "device or browser speech-synthesis" in files["privacy"] and "Voice playback is processed locally" in files["privacy"],
              "DCDS AI composer omits image upload controls and retains microphone input": "voiceButton" in files["ai"] and "SpeechRecognition" in files["ai"] and "attachImageButton" not in files["ai"] and "imageInput" not in files["ai"] and "requestBody.image" not in files["ai"],
              "DCDS AI page provides free device voice playback": "Listen · free voice" in files["ai"] and "speechSynthesis" in files["ai"] and "dcds-ai-speech-session" not in files["ai"],
              "OpenAI voice session is JWT-protected and age-gated": "getUser()" in files["speech"] and "guardian_consent_status" in files["speech"],
              "OpenAI voice API key stays server-side": 'Deno.env.get("OPENAI_API_KEY")' in files["speech"],
              "OpenAI voice function returns only the SDP answer": 'return json({ success: true, sdp: answerSdp, voice: "marin" })' in files["speech"] and "client_secret" not in files["speech"],
              "Browser does not call OpenAI directly or receive project credentials": "api.openai.com" not in files["ai"] and "data.client_secret" not in files["ai"],
              "Gemini provider age rule is disclosed in the privacy notice": "adults aged 18 or older" in files["privacy"] and "Users under 18 cannot use the AI assistant" in files["privacy"],
          }
          for name, passed in checks.items():
              print(("PASS " if passed else "FAIL ") + name)
          failures = [name for name, passed in checks.items() if not passed]
          if failures:
              raise SystemExit(f"{len(failures)} GitHub Pages release checks failed.")

          for page_name in ("index.html", "ai-learning-assistant.html", "dcds-ai-access-review.html", "student-management.html", "admin-notifications.html"):
              html = Path(page_name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {page_name}.")
              for index, script in enumerate(scripts):
                  if script.strip():
                      Path(f"/tmp/{Path(page_name).stem}-{index}.js").write_text(script, encoding="utf-8")
          print("Validated GitHub Pages wiring and DCDS AI release gates.")
          PY
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("student-management.html", "utf8");
          const marker = "// Keep Cloudflare branch previews isolated from live Production data.";
          const start = html.indexOf(marker);
          const end = html.indexOf("const $ = id", start);
          if (start < 0 || end < 0) throw new Error("Admin Supabase routing block could not be located.");
          const source = html.slice(start, end) + "\nJSON.stringify([SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY]);";
          const development = [
            "https://tjgsxbmkpvktlqulbktv.supabase.co",
            "sb_publishable_HHR1gFS6wHvljkTZ0nLWMw_7kfVM3Mn"
          ];
          const production = [
            "https://qxsenflgaweeadvggnyp.supabase.co",
            "sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP"
          ];
          const cases = [
            ["dcds-dev-auth-preview.pages.dev", development],
            ["4a462e28.dcds-dev-auth-preview.pages.dev", development],
            ["feature-dcds-production-read.dcds-dev-auth-preview.pages.dev", development],
            ["dechampions03-leader.github.io", production],
            ["www.dechampionsdigital.com", production],
            ["dcds-dev-auth-preview.pages.dev.attacker.example", production]
          ];
          for (const [hostname, expected] of cases) {
            const sandbox = {
              window: {
                location: { hostname },
                supabase: { createClient: () => ({}) }
              }
            };
            const actual = JSON.parse(vm.runInNewContext(source, sandbox));
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error("Incorrect Supabase environment selected for host: " + hostname);
            }
            console.log("PASS Admin backend routing for " + hostname);
          }
          NODE
          for script in /tmp/ai-learning-assistant-*.js /tmp/dcds-ai-access-review-*.js /tmp/student-management-*.js /tmp/admin-notifications-*.js; do
            [ -f "$script" ] && node --check "$script"
          done
