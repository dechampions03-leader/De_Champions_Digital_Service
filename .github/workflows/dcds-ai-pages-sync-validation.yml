name: DCDS GitHub Pages AI sync validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai-learning-assistant.html"
      - "dcds-ai-access-review.html"
      - "admin-notifications.html"
      - "student-dashboard.html"
      - "student-management.html"
      - "privacy-policy.html"
      - "index.html"
      - "ai-config/captcha-public-config.js"
      - "ai-config/DCDS-MASTER-BRAIN.md"
      - "ai-config/DCDS-AI-MEMORY-GOVERNANCE.md"
      - "ai-config/DCDS-RESPONSE-PLAYBOOK.md"
      - "ai-config/DCDS-AI-EVALUATION-TESTS.json"
      - "dcds-ai-knowledge-base.json"
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/functions/dcds-ai-speech-session/**"
      - "supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql"
      - "supabase/migrations/20261113160210_dcds_ai_age_policy_autoapproval_guard.sql"
      - "supabase/migrations/20261124130000_dcds_ai_root_admin_identity.sql"
      - ".github/workflows/dcds-ai-pages-sync-validation.yml"

permissions:
  contents: read

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published DCDS AI pages and project wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              "ai": Path("ai-learning-assistant.html").read_text(encoding="utf-8"),
              "review": Path("dcds-ai-access-review.html").read_text(encoding="utf-8"),
              "admin": Path("admin-notifications.html").read_text(encoding="utf-8"),
              "dashboard": Path("student-dashboard.html").read_text(encoding="utf-8"),
              "privacy": Path("privacy-policy.html").read_text(encoding="utf-8"),
              "home": Path("index.html").read_text(encoding="utf-8"),
              "captcha": Path("ai-config/captcha-public-config.js").read_text(encoding="utf-8"),
              "student-management": Path("student-management.html").read_text(encoding="utf-8"),
              "edge": Path("supabase/functions/dcds-ai-chat/index.ts").read_text(encoding="utf-8"),
              "speech": Path("supabase/functions/dcds-ai-speech-session/index.ts").read_text(encoding="utf-8"),
              "age-policy-migration": Path("supabase/migrations/20261113160000_dcds_ai_global_age_access_controls.sql").read_text(encoding="utf-8"),
              "root-admin-migration": Path("supabase/migrations/20261124130000_dcds_ai_root_admin_identity.sql").read_text(encoding="utf-8"),
              "brain": Path("ai-config/DCDS-MASTER-BRAIN.md").read_text(encoding="utf-8"),
              "memory": Path("ai-config/DCDS-AI-MEMORY-GOVERNANCE.md").read_text(encoding="utf-8"),
              "playbook": Path("ai-config/DCDS-RESPONSE-PLAYBOOK.md").read_text(encoding="utf-8"),
              "knowledge": Path("dcds-ai-knowledge-base.json").read_text(encoding="utf-8"),
          }
          production_url = "https://qxsenflgaweeadvggnyp.supabase.co"
          development_ref = "tjgsxbmkpvktlqulbktv"
          submit_handler = files["ai"].split("form.addEventListener('submit'", 1)[1].split(" });\n})();", 1)[0]

          checks = {
              "AI chat page points to Production Supabase": production_url in files["ai"],
              "Admin review page points to Production Supabase": production_url in files["review"],
              "No Development project URL is embedded in published pages": all(development_ref not in value for value in files.values()),
              "Public guest entry is visible and visitor mode cannot display private student tools": "guestAccessPanel" in files["ai"] and "studentTools.hidden=true" in files["ai"] and "visitor chats are temporary" in files["ai"],
              "AI access review form is present": "dcds_ai_access_eligibility" in files["ai"] and "aiEligibilityPanel" in files["ai"],
              "Admin access review screen is noindex": "noindex" in files["review"].lower() and "nofollow" in files["review"].lower(),
              "Admin Centre links to the access review screen": 'href="dcds-ai-access-review.html"' in files["admin"],
              "Student dashboard links to DCDS AI": 'href="ai-learning-assistant.html?source=student-dashboard"' in files["dashboard"],
              "Admin dashboard links directly to AI Access Review": 'href="dcds-ai-access-review.html"' in files["student-management"] and "is_dcds_admin" in files["student-management"],
              "Homepage retains its public AI entry point": "ai-learning-assistant.html" in files["home"],
              "Main login page loads the Turnstile public configuration": 'src="ai-config/captcha-public-config.js"' in files["home"],
              "Turnstile UI and token validation hooks are present": "dcdsCaptchaMarkup" in files["home"] and "getDcdsCaptchaToken" in files["home"],
              "Turnstile widget is visible when enabled": 'appearance:"always"' in files["home"],
              "Supabase signup, login and reset receive CAPTCHA tokens": "captchaToken" in files["home"] and "signInWithPassword(signInCredentials)" in files["home"] and "options:{captchaToken}" in files["home"] and "resetPasswordForEmail(email,{redirectTo,...(captchaToken?{captchaToken}:{})})" in files["home"],
              "Turnstile login waits for and reads a completed widget token": "turnstile.getResponse(dcdsAuthTurnstileWidgetId)" in files["home"] and "Cloudflare is still verifying" in files["home"],
              "Administrator AI access bypasses student eligibility review": "if(isAdmin)" in files["ai"] and "setChatEnabled(true)" in files["ai"],
              "Admin AI access panel explains retired adult global toggles and preserves the guardian review link": "adult global approval switches have been retired" in files["student-management"] and "dcds-ai-access-review.html" in files["student-management"] and "aiAdultAccessToggle" not in files["student-management"] and "aiTeenAccessToggle" not in files["student-management"],
              "Adult visitors can use public AI without a DCDS student account": "guestAccessPanel" in files["ai"] and "signInAnonymously" in files["ai"] and "dcdsGuestCaptcha" in files["ai"],
              "Anonymous visitor creation is protected by Turnstile": "captcha-public-config.js" in files["ai"] and "captchaToken:guestCaptchaToken" in files["ai"] and "appearance:'always'" in files["ai"],
              "Guest messages carry an explicit adult confirmation": "adult_confirmation=true" in files["ai"] and "body.adult_confirmation !== true" in files["edge"],
              "Guests cannot access student-only saved history or enrolled lessons": 'if (role === "student")' in files["edge"] and "data.role==='guest'" in files["ai"] and "isGuestSession=true" in files["ai"],
              "Adults do not require a second global access switch": "dcds_ai_access_settings" not in files["edge"],
              "Gemini-backed DCDS AI is server-gated to signed-in adults aged 18+": 'eligibility?.age_band === "18_plus"' in files["edge"] and "UNDER_18_AI_UNAVAILABLE" in files["edge"] and "guardian_consent_status === \"verified\"" not in files["edge"],
              "Visitors and administrators must explicitly confirm 18+": "body.adult_confirmation !== true" in files["edge"] and "adminAgeGate" in files["ai"] and "guestAdultConfirm" in files["ai"],
              "Visitor mode does not return before the chat form handler is attached": "await showGuestAccess();" in files["ai"] and "await showGuestAccess();return" not in files["ai"],
              "Signed-in welcome greeting is personalised from profile full_name": "user_metadata" in files["ai"] and "configureWelcomeGreeting" in files["ai"],
              "Root admin identity is verified only through the protected database role": "is_dcds_super_admin" in files["edge"] and "isRootAdmin" in files["edge"] and "a.role = 'super_admin'" in files["root-admin-migration"] and "public.dcds_admins" in files["root-admin-migration"],
              "Deyriva receives verified root-admin guidance and reports the role to the UI": "VERIFIED DCDS ROOT ADMINISTRATOR" in files["edge"] and "is_root_admin: isRootAdmin" in files["edge"] and "data.is_root_admin===true" in files["ai"],
              "DCDS AI page displays director status only after an authenticated root-admin RPC": "client.rpc('is_dcds_super_admin')" in files["ai"] and "Director · Deyriva owner" in files["ai"],
              "Homepage resolves administrator access only after a server-side role check": "refreshDcdsAccountButton" in files["home"] and "rpc('is_dcds_admin')" in files["home"] and "Admin Portal" in files["home"] and "if(dcdsAccountRole==='admin')" in files["home"],
              "Administrator portal wording is consistent across the main admin workspaces": "DCDS Administration Portal | Communications" in files["admin"] and "DCDS Administration Portal" in files["student-management"] and "Administration Portal" in files["dashboard"],
              "Deyriva uses Administrator or Director for verified owner greetings": "Hello, Administrator." in files["ai"] and '"Administrator" or "Director"' in files["edge"],
              "Deyriva does not volunteer the root owner's Founder/CEO identity": "Do not volunteer or casually mention their Founder/CEO identity" in files["edge"],
              "Student self-identity uses the current account profile and own enrolments only": "studentIdentityGuidance" in files["edge"] and "needsIdentity" in files["edge"] and "own_enrolments" in files["edge"],
              "Fresh student chats carry forward only the latest private conversation": "RECENT PRIVATE STUDENT CONVERSATION CONTINUITY" in files["edge"] and '.eq("user_id", user.id)' in files["edge"] and ".limit(10)" in files["edge"],
              "Deyriva's approved knowledge includes a route-aware platform directory": '"platform_directory"' in files["knowledge"] and "student_programmes" in files["knowledge"] and "administrative_workspaces" in files["knowledge"],
              "AI memory governance documents owner-scoped cross-chat continuity": "Cross-chat continuity" in files["memory"] and "same student's most recently active saved conversation" in files["memory"],
              "Master Brain and Response Playbook contain the new identity privacy rules": "Administrator" in files["brain"] and "Do not volunteer the Founder/CEO identity" in files["playbook"],
              "Failed chat sends preserve the draft and do not reopen the mobile keyboard": "your draft is still in the message box" in files["ai"] and "input.blur()" in files["ai"] and "input.focus()" not in submit_handler,
              "AI pagehide cleanup references a defined function so the submit handler can register": "function stopSpeechPlayback()" in files["ai"] and "window.addEventListener('pagehide',stopSpeechPlayback)" in files["ai"] and "stopOpenAiSpeech" not in files["ai"],
              "Public visitor processing and temporary chats are disclosed": "visitor chat transcripts" in files["privacy"] and "temporary anonymous session" in files["privacy"],
              "Age policy database migration is present": "create table if not exists public.dcds_ai_access_settings" in files["age-policy-migration"],
              "Production CAPTCHA activation is enabled after Supabase Auth secret is configured": 'authProtectionEnabled: true' in files["captcha"],
              "Privacy notice identifies the Gemini provider": "Google Gemini API" in files["privacy"],
              "Deyriva's free provider pool includes Google-hosted Gemma 4 fallbacks": '"gemma-4-26b-a4b-it"' in files["edge"] and '"gemma-4-31b-it"' in files["edge"],
              "Privacy notice warns about free-tier human review": "human reviewers" in files["privacy"].lower(),
              "Privacy notice explains image attachment processing": "image attachments" in files["privacy"].lower() and "not stored as image files" in files["privacy"],
              "Privacy notice explains optional browser voice processing": "speech-recognition" in files["privacy"] and "raw microphone recording" in files["privacy"],
              "Privacy notice explains optional device voice playback": "device or browser speech-synthesis" in files["privacy"] and "Voice playback is processed locally" in files["privacy"],
              "DCDS AI composer omits image upload controls and retains microphone input": "voiceButton" in files["ai"] and "SpeechRecognition" in files["ai"] and "attachImageButton" not in files["ai"] and "imageInput" not in files["ai"] and "requestBody.image" not in files["ai"],
              "DCDS AI page provides free device voice playback": "Listen · free voice" in files["ai"] and "speechSynthesis" in files["ai"] and "dcds-ai-speech-session" not in files["ai"],
              "OpenAI voice session is JWT-protected and age-gated": "getUser()" in files["speech"] and "guardian_consent_status" in files["speech"],
              "OpenAI voice API key stays server-side": 'Deno.env.get("OPENAI_API_KEY")' in files["speech"],
              "OpenAI voice function returns only the SDP answer": 'return json({ success: true, sdp: answerSdp, voice: "marin" })' in files["speech"] and "client_secret" not in files["speech"],
              "Browser does not call OpenAI directly or receive project credentials": "api.openai.com" not in files["ai"] and "data.client_secret" not in files["ai"],
              "Gemini provider age rule is disclosed in the privacy notice": "adults aged 18 or older" in files["privacy"] and "Users under 18 cannot use the AI assistant" in files["privacy"],
          }
          for name, passed in checks.items():
              print(("PASS " if passed else "FAIL ") + name)
          failures = [name for name, passed in checks.items() if not passed]
          if failures:
              raise SystemExit(f"{len(failures)} GitHub Pages release checks failed.")

          for page_name in ("index.html", "ai-learning-assistant.html", "dcds-ai-access-review.html"):
              html = Path(page_name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {page_name}.")
              for index, script in enumerate(scripts):
                  if script.strip():
                      Path(f"/tmp/{Path(page_name).stem}-{index}.js").write_text(script, encoding="utf-8")
          print("Validated GitHub Pages wiring and DCDS AI release gates.")
          PY
          for script in /tmp/ai-learning-assistant-*.js /tmp/dcds-ai-access-review-*.js; do
            [ -f "$script" ] && node --check "$script"
          done
