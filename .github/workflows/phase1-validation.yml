name: Phase 1 validation

on:
  push:
    branches:
      - feature/phase1-security-reliability
    paths:
      - "supabase/functions/create-payment/**"
      - "supabase/functions/admin-verify-flutterwave-payment/**"
      - "supabase/functions/dcds-process-payout/**"
      - "supabase/functions/dcds-international-payout/**"
      - "supabase/functions/dcds-international-payout-webhook/**"
      - "supabase/functions/flutterwave-webhook/**"
      - "supabase/functions/dcds-create-account/**"
      - "supabase/functions/dcds-ai-chat/**"
      - "supabase/migrations/**"
      - ".github/workflows/phase1-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/create-payment/**"
      - "supabase/functions/admin-verify-flutterwave-payment/**"
      - "supabase/functions/dcds-process-payout/**"
      - "supabase/functions/dcds-international-payout/**"
      - "supabase/functions/dcds-international-payout-webhook/**"
      - "supabase/functions/dcds-create-account/**"
      - "supabase/migrations/**"
      - ".github/workflows/phase1-validation.yml"

permissions:
  contents: read

concurrency:
  group: phase1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-function-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check create-payment
        run: deno check supabase/functions/create-payment/index.ts
      - name: Type-check admin Flutterwave verifier
        run: deno check supabase/functions/admin-verify-flutterwave-payment/index.ts
      - name: Type-check payout processor
        run: deno check supabase/functions/dcds-process-payout/index.ts
      - name: Type-check international payout foundation
        run: deno check supabase/functions/dcds-international-payout/index.ts
      - name: Type-check international payout webhook
        run: deno check supabase/functions/dcds-international-payout-webhook/index.ts
      - name: Type-check combined Flutterwave webhook
        run: deno check supabase/functions/flutterwave-webhook/index.ts
      - name: Type-check DCDS account creation function
        run: deno check supabase/functions/dcds-create-account/index.ts
      - name: Type-check DCDS AI chat function
        run: deno check supabase/functions/dcds-ai-chat/index.ts
      - name: Verify Phase 1 migration invariants
        shell: bash
        run: |
          test -f supabase/migrations/20261110000100_phase1_security_reliability.sql
          grep -q "email_confirmed_at" supabase/functions/create-payment/index.ts
          grep -q "dcds_create_checkout_order" supabase/functions/create-payment/index.ts
          grep -q "provider_transfer_id" supabase/functions/dcds-process-payout/index.ts
          grep -qi "on delete restrict" supabase/migrations/20261110000100_phase1_security_reliability.sql
          test -f supabase/migrations/20261111110000_dcds_admin_payment_operations.sql
          test -f supabase/migrations/20261111113000_dcds_payment_verification_audit_event.sql
          grep -q "admin_approve_manual_bank_payment" supabase/migrations/20261111110000_dcds_admin_payment_operations.sql
          grep -q "dcds-payment-receipts" supabase/migrations/20261111110000_dcds_admin_payment_operations.sql
          grep -q "verify_by_reference" supabase/functions/admin-verify-flutterwave-payment/index.ts

      - name: Verify pending checkout reconciliation safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20261112081327_dcds_pending_checkout_reconciliation.sql").read_text(encoding="utf-8")
          create_payment = Path("supabase/functions/create-payment/index.ts").read_text(encoding="utf-8")
          admin_verify = Path("supabase/functions/admin-verify-flutterwave-payment/index.ts").read_text(encoding="utf-8")
          admin_page = Path("student-management.html").read_text(encoding="utf-8")

          checks = {
              "new orders have a persisted checkout expiry": "checkout_expires_at" in migration and "p_checkout_expires_at" in create_payment,
              "local expiry is recorded but never auto-fails an order": "checkout_expires_at" in migration and "SET status = 'failed'" not in migration.split("CREATE OR REPLACE FUNCTION public.admin_release_pending_flutterwave_checkout", 1)[0],
              "legacy and expired pending orders remain blocked until provider review": "checkout_expires_at timestamptz" in migration and "Legacy and expired pending orders deliberately remain blocking" in migration,
              "new Flutterwave sessions have provider-side timeout and link expiry": "session_duration: 60" in create_payment and "max_retry_attempt: 3" in create_payment and "link_expiration: checkoutExpiresAt.toISOString()" in create_payment,
              "reconciliation checks are written to the audit trail": 'event_type: "flutterwave_reconciliation_checked"' in admin_verify and "'flutterwave_reconciliation_checked'" in migration,
              "not-found or failed provider checks do not automatically release the order": 'outcome = referenceNotFound ? "not_found" : "unconfirmed"' in admin_verify and 'outcome = terminalFailure' in admin_verify and "order_unchanged: true" in admin_verify,
              "release requires the latest recent provider check and a closed/expired link": "interval '2 hours'" in migration and "p_confirm_link_disabled" in migration and "v_link_expired" in migration and "ORDER BY e.created_at DESC" in migration and "v_check.details ->> 'outcome' NOT IN ('not_found','failed')" in migration,
              "release is blocked when a non-failed payment or linked enrolment exists": "p.status <> 'failed'" in migration and "e.order_id = p_order_id" in migration,
              "release creates an auditable administrator event": "'pending_checkout_released'" in migration and "administrator_confirmation_note" in migration,
              "admin UI exposes the guarded release action": 'action:"release_pending"' in admin_page and "Release checkout as unpaid" in admin_page,
              "new checkout-order RPC remains service-role only": "REVOKE ALL ON FUNCTION public.dcds_create_checkout_order(uuid,uuid,text,text,timestamptz)" in migration and "TO service_role" in migration,
          }

          failures = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS " if passed else "FAIL ") + name)
          if failures:
              raise SystemExit(f"{len(failures)} pending-checkout reconciliation checks failed.")
          PY

      - name: Require RLS on every new public table
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          files = sorted(glob.glob("supabase/migrations/*.sql"))
          failures = []
          created_pattern = r'(?im)^\s*CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+(?:"?public"?\s*\.\s*)?"?([A-Za-z_][A-Za-z0-9_]*)"?'
          for path in files:
              with open(path, encoding="utf-8") as source:
                  sql = source.read()
              created = re.findall(created_pattern, sql)
              for table in created:
                  rls_pattern = (
                      rf'(?im)^\s*ALTER\s+TABLE(?:\s+IF\s+EXISTS)?\s+'
                      rf'(?:"?public"?\s*\.\s*)?"?{re.escape(table)}"?'
                      rf'\s+ENABLE\s+ROW\s+LEVEL\s+SECURITY\s*;'
                  )
                  if not re.search(rls_pattern, sql):
                      failures.append(f"{path}: {table} is created without explicit RLS enablement")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"Verified explicit RLS enablement for all new public tables across {len(files)} migration files.")
          PY
