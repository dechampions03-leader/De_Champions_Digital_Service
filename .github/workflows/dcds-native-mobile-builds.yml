name: DCDS native mobile build checks

on:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/dcds-native-mobile-builds.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/dcds-native-mobile-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcds-native-mobile-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Generate Android project and compile debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate DCDS web bundle
        run: npm run build

      - name: Generate Android native project
        run: npx cap add android

      - name: Sync DCDS web assets to Android
        run: npx cap sync android

      - name: Compile Android debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android debug APK and native project
        uses: actions/upload-artifact@v4
        with:
          name: dcds-android-debug
          path: |
            mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-app/android/
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Generate iOS project and compile simulator build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate DCDS web bundle
        run: npm run build

      - name: Generate iOS native project
        run: npx cap add ios

      - name: Sync DCDS web assets to iOS
        run: npx cap sync ios

      - name: Compile iOS Simulator app (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS project and simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app \
            ios/build/DCDS-iOS-Simulator-App.zip
          ditto -c -k --sequesterRsrc --keepParent \
            ios \
            ios/build/DCDS-iOS-Native-Project.zip

      - name: Upload iOS simulator build and native project
        uses: actions/upload-artifact@v4
        with:
          name: dcds-ios-simulator
          path: |
            mobile-app/ios/build/DCDS-iOS-Simulator-App.zip
            mobile-app/ios/build/DCDS-iOS-Native-Project.zip
          if-no-files-found: error
          retention-days: 14
