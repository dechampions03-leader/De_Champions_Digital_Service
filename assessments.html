<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCDS | Quizzes & Assignments</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root {
--bg:#10091c;
--panel:#1d102c;
--purple:#8738d1;
--light:#d9b8ff;
--muted:#c7b9d7;
--gold:#d4af37;
--line:#563477
}
* {
box-sizing:border-box
}
body {
margin:0;
background:var(--bg);
color:#fff;
font:15px Arial,sans-serif
}
header {
padding:22px 6%;
background:linear-gradient(120deg,#210b3d,#451080);
border-bottom:1px solid var(--line)
}
header b {
font-size:23px;
letter-spacing:3px;
color:var(--light)
}
header p {
font-size:11px;
letter-spacing:2px;
color:var(--muted)
}
main {
max-width:900px;
margin:auto;
padding:25px 16px
}
.panel,.card {
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:20px;
margin:16px 0
}
h1,h2,h3 {
color:var(--light)
}
p,.muted {
color:var(--muted);
line-height:1.7
}
button {
border:0;
border-radius:9px;
padding:12px 16px;
background:linear-gradient(120deg,#8738d1,#a44bea);
color:white;
font-weight:bold;
cursor:pointer;
margin:8px 6px 0 0
}
button:disabled {
opacity:.5
}
.option {
display:block;
padding:12px;
border:1px solid var(--line);
border-radius:9px;
margin:8px 0
}
.option input {
margin-right:8px
}
.field {
width:100%;
padding:12px;
border-radius:9px;
border:1px solid var(--line);
background:#10091c;
color:#fff
}
.hidden {
display:none!important
}
.notice {
padding:14px;
border:1px solid var(--line);
border-radius:10px;
color:var(--muted)
}
small {
color:var(--muted)
}
</style>
</head><body><header><b>DCDS</b><p>CREATE • LEARN • INNOVATE • EARN</p></header>
<main><section id="status" class="panel">Loading your assessments…</section>
<div id="content" class="hidden"><section class="panel"><h1>Quizzes & Assignments</h1><p>Test your understanding, submit practical work and review your academic feedback.</p></section><h2>Available quizzes</h2><div id="quizzes"></div><h2>Course assignments</h2><div id="assignments"></div></div></main><script>
const db=window.supabase.createClient("https://qxsenflgaweeadvggnyp.supabase.co","sb_publishable_pjQHFevEKbynxM710gAHAA_a33-yeNP"),$=id=>document.getElementById(id);
let user=null,activeAttempt=null;
function esc(s) {
return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;
","<":"&lt;
",">":"&gt;
",'"':"&quot;","'":"&#39;
"}[c]))}
async function init(){const {data:{user:u},error}=await db.auth.getUser();if(error||!u){$("status").textContent="Please sign in to access your course assessments.";return}user=u;const en=await db.from("enrollments").select("course_id").eq("user_id",u.id);if(en.error)throw en.error;const ids=(en.data||[]).map(x=>x.course_id);if(!ids.length){$("status").textContent="You need an active course enrollment to access assessments.";return}
const [qr,ar]=await Promise.all([db.from("quizzes").select("id,course_id,title,description,instructions,time_limit_seconds,max_attempts,pass_mark").eq("status","published").in("course_id",ids),db.from("assignments").select("id,course_id,title,description,instructions,due_at,max_score,allow_late_submissions").eq("status","published").in("course_id",ids)]);
if(qr.error)throw qr.error;if(ar.error)throw ar.error;
$("quizzes").innerHTML=(qr.data||[]).map(q=>'<article class="card"><h3>'+esc(q.title)+'</h3><p>'+esc(q.description||"")+'</p><small>Attempts: '+q.max_attempts+' • Pass mark: '+q.pass_mark+'% • '+(q.time_limit_seconds?Math.round(q.time_limit_seconds/60)+' minutes':'No time limit')+'</small><div id="quizbox-'+q.id+'"></div><button data-start="'+q.id+'">Start quiz</button></article>').join("")||'<div class="notice">No published quizzes are available yet.</div>';
$("assignments").innerHTML=(ar.data||[]).map(a=>'<article class="card"><h3>'+esc(a.title)+'</h3><p>'+esc(a.description)+'</p><p>'+esc(a.instructions||"")+'</p><small>Due: '+(a.due_at?new Date(a.due_at).toLocaleString():"No due date")+' • Maximum score: '+a.max_score+'</small><form data-assignment="'+a.id+'"><label>Written response</label><textarea class="field" name="submission_text" rows="4" placeholder="Write your response here"></textarea><label>Optional link to your project or file</label><input class="field" name="submission_url" type="url" placeholder="https://..."><button>Submit assignment</button></form><div id="assignment-status-'+a.id+'" class="muted"></div></article>').join("")||'<div class="notice">No published assignments are available yet.</div>';
$("status").textContent="Your assessments are ready.";
$("content").classList.remove("hidden");
}
document.addEventListener("click",async e=> {
const b=e.target.closest("button[data-start]");
if(!b)return;
const id=b.dataset.start,box=$("quizbox-"+id);
b.disabled=true;
const start=await db.rpc("start_dcds_quiz", {
p_quiz_id:id
});
if(start.error) {
box.textContent=start.error.message;
b.disabled=false;
return
}
activeAttempt=start.data;
const q=await db.from("quiz_questions").select("id,question_text,options,points,sort_order").eq("quiz_id",id).order("sort_order");
if(q.error) {
box.textContent=q.error.message;
b.disabled=false;
return
}
box.innerHTML='<form id="attempt-'+id+'">'+q.data.map((x,i)=>'<div class="card"><b>'+(i+1)+'. '+esc(x.question_text)+'</b><p><small>'+x.points+' point(s)</small></p>'+x.options.map(o=>'<label class="option"><input type="radio" name="'+x.id+'" value="'+esc(o.key)+'"> '+esc(o.key)+'. '+esc(o.text)+'</label>').join("")+'</div>').join("")+'<button>Submit quiz</button></form>';
$("attempt-"+id).onsubmit=async ev=> {
ev.preventDefault();
const answers= {
};
q.data.forEach(x=> {
const v=ev.target.querySelector('input[name="'+x.id+'"]:checked');
if(v)answers[x.id]=v.value
});
if(!confirm("Submit your answers now? You cannot change them after submission."))return;
const result=await db.rpc("submit_dcds_quiz", {
p_attempt_id:activeAttempt,p_answers:answers
});
if(result.error) {
box.textContent=result.error.message;
return
}
const r=result.data;
box.textContent="Quiz submitted. Score: "+r.score+"/"+r.total_points+" ("+r.percentage+"%). "+(r.passed?"You passed!":"Keep practising and review your lessons.");
ev.target.remove();
};
b.remove();
});
document.addEventListener("submit",async e=> {
const f=e.target.closest("form[data-assignment]");
if(!f)return;
e.preventDefault();
const d=new FormData(f),text=d.get("submission_text").trim(),url=d.get("submission_url").trim();
if(!text&&!url) {
alert("Write a response or add a project link.");
return
}
const r=await db.from("assignment_submissions").insert( {
assignment_id:f.dataset.assignment,user_id:user.id,submission_text:text||null,submission_url:url||null
});
$("assignment-status-"+f.dataset.assignment).textContent=r.error?r.error.message:"Your assignment has been submitted successfully.";
if(!r.error)f.reset();
});
init().catch(e=> {
$("status").textContent="Could not load assessments: "+e.message
});
</script></body></html>
