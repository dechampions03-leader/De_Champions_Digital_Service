<style id="dcds-scroll-motion">

.dcds-motion-ready [data-dcds-reveal]{opacity:0;transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.25,1),filter .82s ease;will-change:opacity,transform}

.dcds-motion-ready [data-dcds-reveal="right"]{transform:translate3d(46px,0,0)}
.dcds-motion-ready [data-dcds-reveal="zoom"]{transform:scale(.94) translateY(18px)}
.dcds-motion-ready [data-dcds-reveal].dcds-visible{opacity:1;transform:none;filter:none}
.dcds-motion-ready [data-dcds-reveal].dcds-visible [data-dcds-child]{animation:dcdsChildPop .58s both;animation-delay:var(--dcds-delay,0ms)}
@keyframes dcdsChildPop{from{opacity:.25;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.dcds-motion-ready [data-dcds-reveal]{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}.dcds-motion-ready [data-dcds-reveal].dcds-visible [data-dcds-child]{animation:none!important}}

  background:radial-gradient(ellipse at 8% 4%,rgba(133,76,205,.075),transparent 38%),radial-gradient(ellipse at 92% 34%,rgba(215,180,90,.055),transparent 34%),linear-gradient(145deg,rgba(255,255,255,.12),transparent 58%);

}

  filter:blur(3px);

<header>
<b>DCDS</b>
<p>CREATE • LEARN • INNOVATE • EARN</p>
</header>
<main>
<section id="status" class="panel">Loading your assessments…</section>
<div id="content" class="hidden">
<section class="panel">
<h1>Quizzes & Assignments</h1>
<p>Test your understanding, submit practical work and review your academic feedback.</p>
</section>
<h2>Available quizzes</h2>
<div id="quizzes">
</div>
<h2>Course assignments</h2>
<div id="assignments">
</div>
</div>
</main><script>

const db=window.supabase.createClient("https://tjgsxbmkpvktlqulbktv.supabase.co","sb_publishable_HHR1gFS6wHvljkTZ0nLWMw_7kfVM3Mn",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let user=null;
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const message=(element,text)=>{element.textContent=text;};

async function init(){
  const {data:{user:currentUser},error}=await db.auth.getUser();
  if(error||!currentUser){$("status").textContent="Please sign in to access your course assessments.";return;}
  user=currentUser;
  const enrollment=await db.from("enrollments").select("course_id").eq("user_id",user.id);
  if(enrollment.error)throw enrollment.error;
  const courseIds=[...new Set((enrollment.data||[]).map(row=>row.course_id))];
  if(!courseIds.length){$("status").textContent="You need an active course enrollment to access assessments.";return;}
  const [quizResult,assignmentResult]=await Promise.all([
    db.from("quizzes").select("id,course_id,title,description,instructions,time_limit_seconds,max_attempts,pass_mark").eq("status","published").in("course_id",courseIds),
    db.from("assignments").select("id,course_id,title,description,instructions,due_at,max_score,allow_late_submissions").eq("status","published").in("course_id",courseIds)
  ]);
  if(quizResult.error)throw quizResult.error;
  if(assignmentResult.error)throw assignmentResult.error;
  $("quizzes").innerHTML=(quizResult.data||[]).map(quiz=>'<article class="card"><h3>'+esc(quiz.title)+'</h3><p>'+esc(quiz.description||"")+'</p><p>'+esc(quiz.instructions||"")+'</p><small>Maximum attempts: '+Number(quiz.max_attempts)+' • Pass mark: '+Number(quiz.pass_mark)+'% • '+(quiz.time_limit_seconds?Math.ceil(quiz.time_limit_seconds/60)+" minutes":"No time limit")+'</small><div id="quizbox-'+esc(quiz.id)+'"></div><button type="button" data-start="'+esc(quiz.id)+'">Start quiz</button></article>').join("")||'<div class="notice">No published quizzes are available yet.</div>';
  $("assignments").innerHTML=(assignmentResult.data||[]).map(assignment=>'<article class="card"><h3>'+esc(assignment.title)+'</h3><p>'+esc(assignment.description||"")+'</p><p>'+esc(assignment.instructions||"")+'</p><small>Due: '+(assignment.due_at?esc(new Date(assignment.due_at).toLocaleString()):"No due date")+' • Maximum score: '+Number(assignment.max_score)+'</small><form data-assignment="'+esc(assignment.id)+'"><label>Written response</label><textarea class="field" name="submission_text" rows="4" maxlength="20000" placeholder="Write your response here"></textarea><label>Optional link to your project or file</label><input class="field" name="submission_url" type="url" maxlength="2000" placeholder="https://..."><button type="submit">Submit assignment</button></form><div id="assignment-status-'+esc(assignment.id)+'" class="muted" role="status"></div></article>').join("")||'<div class="notice">No published assignments are available yet.</div>';
  $("status").textContent="Your assessments are ready.";
  $("content").classList.remove("hidden");
}

document.addEventListener("click",async event=>{
  const button=event.target.closest("button[data-start]");if(!button)return;
  const quizId=button.dataset.start,box=$("quizbox-"+quizId);
  button.disabled=true;box.textContent="Starting your quiz…";
  const start=await db.rpc("start_dcds_quiz",{p_quiz_id:quizId});
  if(start.error){box.textContent=start.error.message;button.disabled=false;return;}
  const attemptId=start.data;
  const questions=await db.from("quiz_questions").select("id,question_text,options,points,sort_order").eq("quiz_id",quizId).order("sort_order",{ascending:true});
  if(questions.error||!questions.data?.length){box.textContent=questions.error?.message||"This quiz has no questions.";button.disabled=false;return;}
  const quizCard=button.closest(".card");
  const timeText=quizCard.querySelector("small").textContent;
  const quizData=await db.from("quizzes").select("time_limit_seconds").eq("id",quizId).single();
  if(quizData.error){box.textContent=quizData.error.message;button.disabled=false;return;}
  const seconds=Number(quizData.data.time_limit_seconds)||0;
  const formId="attempt-"+quizId;
  box.innerHTML=(seconds?'<p class="notice" id="timer-'+esc(quizId)+'" role="timer">Time remaining: '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,"0")+'</p>':"")+'<form id="'+formId+'" data-attempt="'+esc(attemptId)+'">'+questions.data.map((question,index)=>{
    const options=Array.isArray(question.options)?question.options:[];
    return '<div class="card"><b>'+(index+1)+'. '+esc(question.question_text)+'</b><p><small>'+Number(question.points)+' point(s)</small></p>'+options.map(option=>'<label class="option"><input type="radio" name="'+esc(question.id)+'" value="'+esc(option.key)+'"> '+esc(option.key)+'. '+esc(option.text)+'</label>').join("")+'</div>';
  }).join("")+'<button type="submit">Submit quiz</button></form>';
  button.remove();
  const form=$(formId);
  let timer=null;
  if(seconds){
    let remaining=seconds;
    const timerNode=$("timer-"+quizId);
    timer=setInterval(()=>{
      remaining=Math.max(0,remaining-1);
      timerNode.textContent="Time remaining: "+Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0");
      if(remaining===0){clearInterval(timer);form.requestSubmit();}
    },1000);
  }
  form.addEventListener("submit",async submitEvent=>{
    submitEvent.preventDefault();
    const submitButton=form.querySelector('button[type="submit"]');
    if(submitButton.disabled)return;
    submitButton.disabled=true;
    const answers={};
    questions.data.forEach(question=>{
      const selected=form.querySelector('input[name="'+question.id+'"]:checked');
      if(selected)answers[question.id]=selected.value;
    });
    const result=await db.rpc("submit_dcds_quiz",{p_attempt_id:attemptId,p_answers:answers});
    if(timer)clearInterval(timer);
    if(result.error){box.textContent="Submission failed: "+result.error.message;return;}
    const score=result.data||{};
    if(score.expired){box.textContent=score.message||"The quiz time limit expired. Your attempt was not graded.";return;}
    box.textContent="Quiz submitted. Score: "+score.score+"/"+score.total_points+" ("+score.percentage+"%). "+(score.passed?"You passed!":"Keep practising and review your lessons.");
  });
});

document.addEventListener("submit",async event=>{
  const form=event.target.closest("form[data-assignment]");if(!form)return;
  event.preventDefault();
  const submitButton=form.querySelector('button[type="submit"]'),status=$("assignment-status-"+form.dataset.assignment);
  const data=new FormData(form),written=String(data.get("submission_text")||"").trim(),url=String(data.get("submission_url")||"").trim();
  if(!written&&!url){message(status,"Write a response or add a project link before submitting.");return;}
  if(url){try{const parsed=new URL(url);if(!["http:","https:"].includes(parsed.protocol))throw new Error();}catch{message(status,"Enter a valid http or https project link.");return;}}
  submitButton.disabled=true;message(status,"Submitting your assignment…");
  const result=await db.from("assignment_submissions").insert({
    assignment_id:form.dataset.assignment,user_id:user.id,submission_text:written||null,submission_url:url||null
  });
  if(result.error){message(status,"Submission was not saved: "+result.error.message);submitButton.disabled=false;return;}
  form.reset();message(status,"Your assignment has been submitted successfully.");
});

init().catch(error=>{$("status").textContent="Could not load assessments: "+error.message;});

</script><footer class="dcds-copyright-footer" style="text-align:center;padding:28px 16px 24px;margin-top:32px;color:#6b6474;font-size:14px;line-height:1.9;border-top:1px solid rgba(109,65,145,.18);">© 2026 De Champions Digital Service.<br><strong style="letter-spacing:.12em;">CREATE • LEARN • INNOVATE • EARN.</strong></footer>
<script id="dcds-scroll-motion-script">
(()=> {
  if(window.__dcdsScrollMotionInstalled) return;
  window.__dcdsScrollMotionInstalled=true;
  const init=()=>{
    const reduced=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const selectors=[
      ".hero",".section-heading",".course-grid",".course-card",".service-card",
      ".general-course-offer",".info-card",".founder-section",".founder-card",
      ".reviews-section",".review-panel",".review-list",".review-item",
      ".dashboard-header",".section-title",".panel",".stat-card",".record-list",
      ".record-row",".certificate-grid",".certificate",".course",
      ".feature-message",".profile-form",".announcement-card",
      "#reviewModerationSection",".review-moderation-card",
      ".support-ticket-card",".detail-panel",".footer","footer"
    ];
    const found=new Set();
    selectors.forEach(selector=>document.querySelectorAll(selector).forEach(el=>{
      if(el.closest("[data-dcds-motion-ignore]")) return;
      found.add(el);
    }));
    const targets=[...found];
    const styles=["rise","pop","left","right","zoom"];
    targets.forEach((el,index)=>{
      if(el.hasAttribute("data-dcds-reveal")) return;
      el.setAttribute("data-dcds-reveal",styles[index%styles.length]);
      const children=[...el.children].filter(child=>child.matches(".course-card,.service-card,.info-card,.record-row,.certificate,.review-item,.stat-card,.announcement-card"));
      children.forEach((child,i)=>{
        child.setAttribute("data-dcds-child","");
        child.style.setProperty("--dcds-delay",Math.min(i*85,510)+"ms");
      });
    });
    if(reduced){targets.forEach(el=>el.classList.add("dcds-visible"));return;}
    document.documentElement.classList.add("dcds-motion-ready");
    if(!("IntersectionObserver" in window)){
      targets.forEach(el=>el.classList.add("dcds-visible"));
      return;
    }
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add("dcds-visible");
          observer.unobserve(entry.target);
        }
      });
    },{threshold:.12,rootMargin:"0px 0px -45px 0px"});
    targets.forEach(el=>observer.observe(el));
  };
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init,{once:true});
  else init();
})();
</script>

<script id="dcds-universal-text-motion">
